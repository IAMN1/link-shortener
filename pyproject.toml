[project]
name = "link-shortener"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt>=5.0.0",
    "celery>=5.6.3",
    "flask>=3.1.2",
    "flask-cors>=6.0.2",
    # Runtime, not tooling: it is the production image's CMD. Absent from
    # here, the image built and then failed on start -- masked in compose,
    # which overrides the command with `flask run`.
    "gunicorn>=23.0.0",
    # Разбор интернационализированных доменов (IDNA 2008 + UTS-46).
    # Встроенный кодек 'idna' в стандартной библиотеке — это IDNA 2003:
    # он не знает раскладки UTS-46, спотыкается о метки длиннее 63 байт
    # после кодирования и по-другому обходится с ß и ς.
    "idna>=3.10",
    # Приходит транзитивно с Flask, но используется напрямую — подпись
    # значений кэша. Объявлено явно, чтобы смена зависимостей Flask не
    # унесла её молча.
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.12.5",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.1",
    "redis>=7.1.0",
    "sqlalchemy[asyncio]>=2.0.45",
    "structlog>=25.5.0",
    "validators>=0.35.0",
]

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "bandit>=1.9.2",
    "black>=26.1.0",
    "flake8>=7.3.0",
    "isort>=7.0.0",
    "mypy>=1.19.1",
    "pylint>=4.0.4",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    # Supplies --error-for-skips, which CI passes and nobody else does.
    # Locked here rather than installed ad hoc in the workflow so its
    # version is pinned by uv.lock like everything else -- which also means
    # it reaches the image, since requirements.txt exports this group whole
    # and Dockerfile pip-installs the file. That is how every linter here
    # already travels; noted rather than fixed. The flag guards the
    # single skip branch the suite has -- an unreachable Docker daemon --
    # which is an honest skip on a laptop and a silent loss of 35
    # PostgreSQL and Redis tests on a runner that is supposed to have it.
    "pytest-error-for-skips>=2.0.2",
    "pytest-mock>=3.15.1",
]

# Без этой секции uv не устанавливает проект в виртуальное окружение,
# и пакет link_shortener не импортируется без ручного PYTHONPATH=src.
# С ней `uv sync` ставит проект в editable-режиме, и команды
# `flask run`, `flask db ...`, `alembic upgrade head` работают из коробки.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["link_shortener", "link_shortener.*"]

# Без этого в установленный пакет попадает только код. Обнаружено при
# запуске продакшн-образа: `flask db load-base-roles` падал с
# `RBAC configuration file not found`, потому что roles.yaml остался в
# репозитории. Не косметика — без ролей анонимное сокращение отвечает 401.
# Шаблоны и статика по той же причине: без них не отрисовывается ни одна
# HTML-страница.
[tool.setuptools.package-data]
link_shortener = [
    "infrastructure/configs/rbac/*.yaml",
    "web/templates/*.html",
    "web/templates/**/*.html",
    "web/static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# --strict-markers and --strict-config used to sit in addopts below and did
# nothing there. Both are OverrideIniAction, and Config.parse freezes the
# override list from the real command line *before* it prepends addopts, so
# a copy living in addopts never reaches getini. Measured: an unregistered
# marker under the old addopts printed "1 passed, 1 warning". Declared as
# ini options they take effect, and they take effect for every invocation
# rather than only for the ones that spell the flags out again.
strict_markers = true
strict_config = true
# The canonical name; `xfail_strict` is its alias. Turns an xfail that has
# started passing into a failure instead of an `xpassed` line nobody reads.
strict_xfail = true

addopts = [
    "-v",
    "--tb=short",
    "--cov=src/link_shortener",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--junitxml=test-results/junit.xml"
]

markers = [
    "unit: unit tests (fast, isolated)",
    "integration: integration tests (require external services)",
    "e2e: end-to-end tests (full system)",
    "slow: slow running tests",
    "database: tests that use database",
    "cache: tests that use cache",
    "api: tests for API endpoints",
]

[tool.flake8]
max-line-length = 88
ignore = "E203, W503"

[tool.pylint.'MESSAGES CONTROL']
disable = """
    W0107,  # unnecessary-pass (нормально для абстрактных методов)
    W0511,  # fixme (можно оставить TODO)
    R0801,  # duplicate-code (фальшивые срабатывания)
"""

[tool.pylint.'MASTER']
fail-under = 9.0
ignore-patterns = ["test_.*", "_test.*"]
