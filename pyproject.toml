[project]
name = "link-shortener"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt>=5.0.0",
    "celery>=5.6.3",
    "flask>=3.1.2",
    "flask-cors>=6.0.2",
    # Runtime, not tooling: it is the production image's CMD. Absent from
    # here, the image built and then failed on start -- masked in compose,
    # which overrides the command with `flask run`.
    "gunicorn>=23.0.0",
    # Разбор интернационализированных доменов (IDNA 2008 + UTS-46).
    # Встроенный кодек 'idna' в стандартной библиотеке — это IDNA 2003:
    # он не знает раскладки UTS-46, спотыкается о метки длиннее 63 байт
    # после кодирования и по-другому обходится с ß и ς.
    "idna>=3.10",
    # Приходит транзитивно с Flask, но используется напрямую — подпись
    # значений кэша. Объявлено явно, чтобы смена зависимостей Flask не
    # унесла её молча.
    "itsdangerous>=2.2.0",
    # Та же причина: шаблоны писем рисуются своим Environment, минуя Flask,
    # — почта уходит из воркера Celery, где приложения нет вовсе.
    "jinja2>=3.1.4",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.12.5",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.1",
    "redis>=7.1.0",
    "sqlalchemy[asyncio]>=2.0.45",
    "structlog>=25.5.0",
    "validators>=0.35.0",
]

[dependency-groups]
# Отдельной группой, а не в `dev`: `uv export` кладёт в requirements.txt
# только группу по умолчанию, а этот файл ставится в образ через pip. Всё из
# `dev` едет в рантайм-образ, всё из своей группы — нет.
# Ставится руками: `uv sync --group browser`.
browser = [
    "playwright>=1.49",
]
dev = [
    "autopep8>=2.3.2",
    "bandit>=1.9.2",
    "black>=26.1.0",
    "flake8>=7.3.0",
    "isort>=7.0.0",
    "mypy>=1.19.1",
    "openapi-spec-validator>=0.7.1",
    "pylint>=4.0.4",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    # Даёт --error-for-skips, которым пользуется только CI. Объявлен здесь,
    # чтобы версию пинил uv.lock; вместе со всеми линтерами группы едет в
    # образ.
    "pytest-error-for-skips>=2.0.2",
    "pytest-mock>=3.15.1",
    "types-pyyaml>=6.0",
]
# Инструмент, которым сняты числа в docs/DEVELOPER_GUIDE.md. Отдельной
# группой по той же причине, что и `browser` выше.
# Запуск: `uv sync --group load`, затем tests/load/locustfile.py.
load = [
    "locust>=2.32",
]

# Без этой секции uv не устанавливает проект в виртуальное окружение,
# и пакет link_shortener не импортируется без ручного PYTHONPATH=src.
# С ней `uv sync` ставит проект в editable-режиме, и команды
# `flask run`, `flask db ...`, `alembic upgrade head` работают из коробки.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["link_shortener", "link_shortener.*"]

# Без этого в установленный пакет попадает только код. Обнаружено при
# запуске продакшн-образа: `flask db load-base-roles` падал с
# `RBAC configuration file not found`, потому что roles.yaml остался в
# репозитории. Не косметика — без ролей анонимное сокращение отвечает 401.
# Шаблоны и статика по той же причине: без них не отрисовывается ни одна
# HTML-страница.
[tool.setuptools.package-data]
link_shortener = [
    "infrastructure/configs/rbac/*.yaml",
    "web/templates/*.html",
    "web/templates/**/*.html",
    # Письма — обычный текст и под шаблоны выше не подпадают.
    "web/templates/**/*.txt",
    "web/static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# Именно ini-опциями, а не флагами в addopts: обе — OverrideIniAction, и
# Config.parse замораживает список переопределений с настоящей командной
# строки до подстановки addopts, поэтому копия внутри addopts до getini не
# доходит. Как ini они действуют на любой запуск.
strict_markers = true
strict_config = true
# Каноническое имя, `xfail_strict` — псевдоним. Внезапно прошедший xfail
# становится отказом, а не строчкой `xpassed`.
strict_xfail = true

addopts = [
    "-v",
    "--tb=short",
    "--cov=src/link_shortener",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    # Нижняя граница на два пункта ниже достигнутого: обычная работа порог
    # не задевает, настоящая потеря задевает. Снижение приходится записывать.
    "--cov-fail-under=88",
    "--junitxml=test-results/junit.xml"
]

# Проставляются автоматически по каталогу — см. `pytest_collection_modifyitems`
# в tests/conftest.py. Руками не пишутся: категория теста — это место, где он
# лежит, и марка, набранная в файле, может с этим местом разойтись.
#
# Прежний список объявлял ещё `slow`, `database`, `cache` и `api`. Их не ставил
# ни один тест из 2444, то есть выбрать по ним было нечего.
markers = [
    # Flask в них бывает — но со всеми службами контейнера, заменёнными на
    # заглушки, поэтому «моков» мало, а внешнего нет ничего.
    "unit: внешних служб не поднимает",
    "integration: несколько настоящих слоёв вместе",
    "docker: нужен поднятый тестовый стек (PostgreSQL и Redis)",
    "e2e: путь пользователя целиком",
]

# flake8 настраивается файлом .flake8: pyproject.toml он не читает.

# Список, а не строка: TOML внутри строки решётку комментарием не считает, и
# pylint принял бы текст комментария за имя сообщения.
[tool.pylint.'MESSAGES CONTROL']
disable = [
    # Нормально для абстрактных методов.
    "unnecessary-pass",
    "unnecessary-ellipsis",
    # TODO разрешается оставить.
    "fixme",
    # Ложные срабатывания: совпадают шапки однотипных обработчиков.
    "duplicate-code",
]

[tool.pylint.'MASTER']
fail-under = 9.0
ignore-patterns = ["test_.*", "_test.*"]

# Проверяется только src, как и bandit: тесты держат заглушки, чьё дело —
# подставиться вместо настоящего объекта, а не повторить его тип.
[tool.mypy]
python_version = "3.12"
files = ["src"]
# Без этого mypy не заходит в тела функций без аннотаций и сообщает об этом
# заметкой, а не ошибкой: ворота молчали бы про весь `di/container.py` и
# CLI-адаптер, где аннотаций нет. В день включения флага так пряталось
# 39 ошибок в 5 файлах при нуле на воротах; восемь из них — про кэш,
# который контейнер раздаёт под четыре роли, а объявлял одной.
check_untyped_defs = true
# Подавление, которое перестало быть нужным, — это ложь о коде: строка
# сообщает, что здесь ограничение, а его уже нет. Двенадцать
# `type: ignore` в src держатся этой настройкой.
warn_unused_ignores = true
warn_redundant_casts = true
# То же про сами секции ниже: пакет, получивший стабы, не должен молча
# остаться в списке необъявленных.
warn_unused_configs = true

# celery и flask_cors не поставляют ни стабов, ни маркера py.typed. Названы
# поимённо, а не общим --ignore-missing-imports: так молчание распространяется
# ровно на два пакета, а новый нетипизированный импорт по-прежнему заметен.
[[tool.mypy.overrides]]
module = ["celery.*", "flask_cors.*"]
ignore_missing_imports = true
