[project]
name = "link-shortener"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "flask>=3.1.2",
    "flask-cors>=6.0.2",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "redis>=7.1.0",
    "sqlalchemy[asyncio]>=2.0.45",
    "structlog>=25.5.0",
    "validators>=0.35.0",
]

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "bandit>=1.9.2",
    "black>=26.1.0",
    "flake8>=7.3.0",
    "isort>=7.0.0",
    "mypy>=1.19.1",
    "pylint>=4.0.4",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["link_shortener", "link_shortener.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov=src/link_shortener",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--junitxml=test-results/junit.xml"
]

markers = [
    "unit: unit tests (fast, isolated)",
    "integration: integration tests (require external services)",
    "e2e: end-to-end tests (full system)",
    "slow: slow running tests",
    "database: tests that use database",
    "cache: tests that use cache",
    "api: tests for API endpoints",
]

[tool.flake8]
max-line-length = 88
ignore = "E203, W503"

[tool.pylint.'MESSAGES CONTROL']
disable = """
    W0107,  # unnecessary-pass (нормально для абстрактных методов)
    W0511,  # fixme (можно оставить TODO)
    R0801,  # duplicate-code (фальшивые срабатывания)
"""

[tool.pylint.'MASTER']
fail-under = 9.0
ignore-patterns = ["test_.*", "_test.*"]
