[project]
name = "link-shortener"
version = "0.9.0"
description = "A URL shortener with clean architecture, RBAC and a two-level cache"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "alembic>=1.18.4",
    "bcrypt>=5.0.0",
    "celery>=5.6.3",
    "flask>=3.1.2",
    # Interface translations. Taken not for substituting strings -- a
    # twenty-line dictionary would have done that -- but for plurals:
    # Russian has three forms (ссылка / ссылки / ссылок), and the rule for
    # choosing among them lives in the gettext catalogues themselves rather
    # than in the page's code. Choosing the form ourselves would mean
    # writing that rule again for every language.
    "flask-babel>=4.0.0",
    "flask-cors>=6.0.2",
    # Runtime, not tooling: it is the production image's CMD. Absent from
    # here, the image built and then failed on start -- masked in compose,
    # which overrides the command with `flask run`.
    "gunicorn>=23.0.0",
    # Parsing internationalised domain names (IDNA 2008 + UTS-46). The
    # standard library's built-in 'idna' codec is IDNA 2003: it knows
    # nothing of the UTS-46 mapping, trips over labels longer than 63 bytes
    # once encoded, and treats ß and ς differently.
    "idna>=3.10",
    # Arrives transitively with Flask, but is used directly -- signing
    # cache values. Declared explicitly so that a change in Flask's
    # dependencies cannot take it away in silence.
    "itsdangerous>=2.2.0",
    # The same reason: the mail templates are rendered by an Environment of
    # their own, bypassing Flask -- the mail goes out from a Celery worker,
    # where there is no application at all.
    "jinja2>=3.1.4",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.12.5",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.1",
    "redis>=7.1.0",
    # Without the `asyncio` extra: nothing in this project is async --
    # no coroutine, no `AsyncSession`, and both drivers it runs on
    # (psycopg for PostgreSQL, the standard library for SQLite) are
    # synchronous. The extra only pinned `greenlet` on every platform,
    # which SQLAlchemy already asks for on the ones that need it.
    "sqlalchemy>=2.0.45",
    "structlog>=25.5.0",
]

[dependency-groups]
# A group of its own rather than part of `dev`: `uv export` puts only the
# default group into requirements.txt, and that file is what pip installs
# into the image. Everything in `dev` travels into the runtime image;
# nothing in a group of its own does.
# Installed by hand: `uv sync --group browser`.
browser = [
    "playwright>=1.49",
]
contract = [
    "schemathesis>=4",
]
dev = [
    # The one formatter, and the only one that agrees with the tree.
    # Measured on 643 files: `autopep8 --diff` proposes nothing, `black`
    # would rewrite 496 of them and `isort` 421 -- so running either of
    # those is not "format before committing", it is reformatting the
    # project. Both were declared and neither was ever run; they are gone.
    # `.flake8` selects no code that rewrites a line, so layout is not a
    # gate either way -- and `autopep8` takes its `select` from that same
    # file, so what the gate watches is what the formatter fixes.
    # `isort` is still installed -- `pylint` depends on it -- but it is no
    # longer declared here as something this project runs.
    "autopep8>=2.3.2",
    "bandit>=1.9.2",
    "flake8>=7.3.0",
    "mypy>=1.19.1",
    "openapi-spec-validator>=0.7.1",
    "pylint>=4.0.4",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    # Provides --error-for-skips, which only CI uses. Declared here so that
    # uv.lock pins its version; it travels into the image along with every
    # linter in the group.
    "pytest-error-for-skips>=2.0.2",
    "pytest-mock>=3.15.1",
    "types-pyyaml>=6.0",
]
# The tool the numbers in docs/development.md were measured with. In a
# group of its own for the same reason as `browser` above.
# To run: `uv sync --group load`, then tests/load/locustfile.py.
load = [
    "locust>=2.32",
]

# Without this section uv does not install the project into the virtual
# environment, and the link_shortener package does not import without a
# manual PYTHONPATH=src. With it, `uv sync` installs the project in editable
# mode and `flask run`, `flask db ...` and `alembic upgrade head` work as
# they stand.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["link_shortener", "link_shortener.*"]

# Without this, only the code reaches the installed package. Found by
# running the production image: `flask db load-base-roles` failed with
# `RBAC configuration file not found`, because roles.yaml had stayed behind
# in the repository. Not cosmetic -- with no roles, anonymous shortening
# answers 401. Templates and static files for the same reason: without them
# not one HTML page renders.
[tool.setuptools.package-data]
link_shortener = [
    "infrastructure/configs/rbac/*.yaml",
    "web/templates/*.html",
    "web/templates/**/*.html",
    # The mail bodies are plain text and are not covered by the templates
    # above.
    "web/templates/**/*.txt",
    "web/static/**/*",
    # Translations. Found by the same trap as roles.yaml: without this line
    # the image installs, starts and quietly serves every page in English,
    # because gettext, finding no catalogue, returns the source text -- and
    # the source text is English. There is no error.
    #
    # `.mo` is what gettext reads; `.po` is what a person edits. Both live
    # in the package: the suite holds one against the other, and without the
    # `.po` beside it there would be nothing to hold it against.
    "web/translations/*.pot",
    "web/translations/**/*.po",
    "web/translations/**/*.mo",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# As ini options rather than flags in addopts: both are OverrideIniAction,
# and Config.parse freezes the list of overrides from the real command line
# before addopts is substituted, so a copy inside addopts never reaches
# getini. As ini options they apply to every run.
strict_markers = true
strict_config = true
# The canonical name; `xfail_strict` is an alias. An xfail that
# unexpectedly passes becomes a failure rather than a line reading
# `xpassed`.
strict_xfail = true

addopts = [
    "-v",
    "--tb=short",
    "--cov=src/link_shortener",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    # A floor rather than a reflection of what has been reached: the gap is
    # left wide so the threshold catches a real loss rather than the
    # movement of ordinary work. Lowering it has to be written down.
    "--cov-fail-under=88",
    "--junitxml=test-results/junit.xml"
]

# Applied automatically by directory -- see `pytest_collection_modifyitems`
# in tests/conftest.py. They are not written by hand: a test's category is
# where it lives, and a marker typed into a file can drift from that place.
#
# The old list also declared `slow`, `database`, `cache` and `api`. No test
# carried any of them, so there was nothing to select by.
markers = [
    # Flask appears in them -- but with every service of the container
    # replaced by a stub, so there is little mocking and nothing external.
    "unit: starts no external service",
    "integration: several real layers together",
    "docker: needs the test stack running (PostgreSQL and Redis)",
    "e2e: a user's path end to end",
    "contract: generated from the published OpenAPI document",
]

# flake8 is configured by the .flake8 file: it does not read
# pyproject.toml.

# A list rather than a string: inside a string TOML does not treat a hash as
# a comment, and pylint would take the comment's text for a message name.
[tool.pylint.'MESSAGES CONTROL']
disable = [
    # Fine on an abstract method.
    "unnecessary-pass",
    "unnecessary-ellipsis",
    # A TODO is allowed to stay.
    "fixme",
    # False positives: the openings of handlers of one kind coincide.
    "duplicate-code",
]

[tool.pylint.'MASTER']
fail-under = 9.0
ignore-patterns = ["test_.*", "_test.*"]

# Only src is checked, as with bandit: the tests hold stubs whose business
# is to stand in for a real object rather than to reproduce its type.
[tool.mypy]
python_version = "3.12"
files = ["src"]
# Without this, mypy does not enter the bodies of unannotated functions and
# reports that as a note rather than an error: the gate would have been
# silent about the whole of `di/container.py` and the CLI adapter, neither
# of which is annotated. On the day the flag was turned on it had been
# hiding 39 errors across 5 files while the gate read zero; eight of them
# were about the cache, which the container hands out under four roles while
# declaring one.
check_untyped_defs = true
# A suppression that is no longer needed is a lie about the code: the line
# says there is a limitation here when there is not. Every `type: ignore` in
# src is held by this setting.
warn_unused_ignores = true
warn_redundant_casts = true
# The same goes for the sections below: a package that has since gained
# stubs must not quietly stay on the list of undeclared ones.
warn_unused_configs = true

# celery, flask_babel and flask_cors ship neither stubs nor a py.typed
# marker. Named one by one rather than covered by a blanket
# --ignore-missing-imports: that way the silence extends to exactly three
# packages, and a new untyped import is still visible.
[[tool.mypy.overrides]]
module = ["celery.*", "flask_babel.*", "flask_cors.*"]
ignore_missing_imports = true
