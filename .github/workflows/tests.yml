# The suite is run twice: in a clean environment and in a hostile one. The
# first answers "does a fresh clone pass", the second "does a polluted
# machine pass the same way". The reasoning is in docs/testing.md, "CI: the
# suite runs twice".

name: tests

on:
  # Every branch and every tag: the work happens in feature branches that
  # are merged locally, so a push is the only guaranteed moment.
  push:
  # The button appears only for files on the default branch.
  workflow_dispatch:

# A newer push turns an older run's verdict into the answer to a question
# nobody is asking any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing is written back. Declared explicitly: the repository's default may
# be read-write.
permissions:
  contents: read

jobs:
  suite:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      # Both halves run to the end: "clean passed, hostile failed" is itself
      # the diagnosis.
      fail-fast: false
      matrix:
        mode: [clean, hostile]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # An exact version: after v7 the action stopped publishing floating
        # major tags, and `v9` does not resolve.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        # --locked, not --frozen: the first checks that uv.lock agrees with
        # pyproject.toml, the second quietly installs whatever is there.
        run: uv sync --locked

      - name: Guard requirements.txt against uv.lock
        # requirements.txt is generated from the same lock file and is what
        # pip installs into the image. Without this comparison CI tests one
        # set of packages while the image carries another.
        #
        # `grep -v '^#'` drops the two-line header naming the command that
        # generated the file; the provenance lines (`# via pkg`) are indented
        # and stay in the comparison.
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project \
            --frozen --no-group browser > "$RUNNER_TEMP/requirements.expected"
          if ! diff -u <(grep -v '^#' requirements.txt) \
                       <(grep -v '^#' "$RUNNER_TEMP/requirements.expected"); then
            echo "::error::requirements.txt is stale -- re-run the uv export"
            exit 1
          fi

      - name: Pre-pull the test stack images
        # tests/support/real_stack.py gives `compose up -d` 60 seconds. That
        # budget was written on a machine where the images were already
        # there.
        run: docker compose -f dockers/docker-compose.test.yml pull --quiet

      - name: Pollute the environment
        if: matrix.mode == 'hostile'
        # Two channels for a leak. The profile loader reads the `.env` file
        # for every profile but testing. Exported variables beat the file and
        # reach the process even when there is no file at all.
        #
        # The values are chosen so that no profile declares any of them: a
        # test that read one of these read this block and nothing else.
        #
        # DATABASE_URL is the channel the leak actually came through. A test
        # that tried to use it fails at create_engine(): SQLAlchemy maps a
        # bare `postgresql://` to the psycopg2 driver, which this project
        # does not have.
        run: |
          cp .env.example .env
          {
            echo "POPULAR_THRESHOLD=7"
            echo "RECENT_DAYS=3"
            echo "CACHE_LINK_TTL=77"
            echo "CACHE_STATS_TTL=13"
            echo "MAX_COLLISION_ATTEMPTS=9"
            echo "JWT_ACCESS_TOKEN_EXPIRE_MINUTES=11"
            echo "DEFAULT_RATE_LIMIT=37"
          } >> .env
          {
            echo "GUEST_LINK_LIMIT=1"
            echo "BATCH_CREATE_LIMIT=2"
            echo "DATABASE_URL=postgresql://prod/real"
            echo "SQLALCHEMY_ECHO=true"
            echo "DATABASE_POOL_SIZE=41"
            echo "DATABASE_MAX_OVERFLOW=43"
            echo "DATABASE_POOL_RECYCLE=47"
          } >> "$GITHUB_ENV"

      - name: Guard the number of tests
        env:
          # A floor, not an equality. Adding tests requires no edit here;
          # losing them does, and that is deliberate.
          #
          # It follows the suite in both directions: 4526 are collected.
          # The gap is 26. Written as a figure rather than in words,
          # because past a hundred the words stop being read and this one
          # is checked by a test that would have to spell every number.
          #
          # The floor is moved up when the suite grows by enough that the
          # old one stops catching anything. It sat at 4200 while the suite
          # reached 4511, which left 311 tests that could be lost in
          # silence -- seven per cent of the run, and the whole point of
          # the guard is that losing tests is loud. Moved with the run that
          # added the documentation tests, not before it: a floor left
          # above the suite fails the build for no reason at all.
          #
          # The 4200 was placed when the suite stood at 4227, a hundred and
          # sixty-one more than the run before it. The dead-code pass closed
          # the holes a mutation probe found in domain, in parsing cache
          # records and in the bodies of Celery tasks; the documentation
          # pass added five -- two hold the OpenAPI document against the
          # route table, two require a described body from every operation
          # that reads one, and one came free, the schema check against
          # infrastructure being parametrised by file and having picked the
          # new one up; three hold the address the application journal
          # writes behind a proxy; and two hold the build context clean.
          MINIMUM_TESTS: 4500
        # `--error-for-skips` closes the door marked "skipped". This closes
        # the one beside it: a test that was never collected gives "N passed"
        # and exit code 0 with a smaller N. The mechanisms are quiet -- a
        # name outside `python_files`, a `collect_ignore` in a conftest, a
        # directory pytest does not walk.
        #
        # The return code is checked before the count is believed: an
        # interrupted collection prints what it collected before the
        # interruption and exits with code 2.
        run: |
          if ! listing=$(uv run pytest tests/ -o addopts="" --collect-only -q); then
            echo "::error::collection did not finish; any count from it is a lie"
            printf '%s\n' "$listing" | tail -20
            exit 1
          fi
          collected=$(printf '%s\n' "$listing" | grep -c '::' || true)
          echo "collected $collected, minimum $MINIMUM_TESTS"
          if [ "$collected" -lt "$MINIMUM_TESTS" ]; then
            echo "::error::the suite lost tests: $collected < $MINIMUM_TESTS"
            exit 1
          fi

      - name: Run the suite
        # `-o addopts=""` drops the whole list from pyproject.toml: it asks
        # for coverage reports, and nobody reads them here. Strictness does
        # not suffer -- strict_markers, strict_config and strict_xfail are
        # declared as ini options rather than flags.
        #
        # `--error-for-skips` turns a skip into a failure. The one branch in
        # the suite that skips is an unreachable Docker daemon: an honest
        # skip on a laptop and a hole on a runner, where Docker has to be
        # there.
        run: >
          uv run pytest tests/ -q --no-cov -o addopts="" --tb=short
          --error-for-skips

      - name: Run the live surface check
        # 157 checks over HTTP, and the only thing that walks every routing
        # rule: the run records which rule answered each request and turns
        # red if one was never reached. It also walks the address
        # confirmation chain through an SMTP receiver of its own.
        #
        # It starts no services: the testing profile ignores the
        # environment, so both halves of the matrix give one answer.
        run: uv run python tests/live/smoke_test.py

      - name: Install the browser
        # On the clean half only: the browser run reads nothing from the
        # environment, and Chromium is a hundred megabytes to download --
        # there is no point fetching it twice for the same answer.
        if: matrix.mode == 'clean'
        run: |
          uv sync --locked --group browser
          uv run playwright install --with-deps chromium

      - name: Run the browser check
        # 67 checks in a real browser. The only thing that executes
        # web/static/js at all: the rest of the suite drives the Flask test
        # client, which has no engine in it, so the page scripts could be
        # broken outright and the suite would stay green.
        if: matrix.mode == 'clean'
        run: uv run python tests/live/browser_test.py

  # The linters as a job of their own, run once: not one of them reads the
  # environment. The steps are separate so the summary says which tool
  # objected.
  #
  # What is not here and why -- docs/testing.md, "CI: the linters".
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: flake8
        # Configured by the .flake8 file: flake8 does not read
        # pyproject.toml. `select` keeps defects (E9, F) and trailing
        # rubbish (W291, W292, W293, W391), and leaves layout out.
        run: uv run flake8 src tests

      - name: pylint
        # The `fail-under = 9.0` threshold is set in pyproject.toml.
        run: uv run pylint src

      - name: bandit
        # src only: to bandit an `assert` is a finding, to a test it is the
        # reason it exists. Findings that have been examined carry
        # `# nosec`.
        run: uv run bandit -r src -q

      - name: mypy
        # Configured by the `[tool.mypy]` section of pyproject.toml; there
        # is no threshold, the gate stands at zero errors. Here the run is
        # always from scratch -- a fresh clone has no cache; locally the
        # same is had with
        # `rm -rf .mypy_cache && uv run mypy --no-incremental src`.
        run: uv run mypy src

      - name: Guard messages.pot against the tree
        # Every `#:` line in the template leads a translator to the place
        # the text is written. It goes stale on any edit that moved lines,
        # and goes stale quietly: gettext reads the `.mo`, which carries no
        # references, so the service answers the same with correct
        # references and with drifted ones, and the price is paid by
        # whoever opens the catalogue to translate it.
        #
        # `grep -v` drops the one line that changes on every run of
        # `extract` regardless of the tree.
        run: |
          # The version is read from pyproject.toml rather than written
          # here: it goes into the `Project-Id-Version` header of every
          # catalogue, and written in two places it would part from the
          # project at the first release -- quietly, because nobody reads a
          # catalogue header.
          V=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          uv run pybabel extract -F babel.cfg -o "$RUNNER_TEMP/messages.expected" \
            --project=link-shortener --version="$V" .
          if ! diff -u <(grep -v '^"POT-Creation-Date' src/link_shortener/web/translations/messages.pot) \
                       <(grep -v '^"POT-Creation-Date' "$RUNNER_TEMP/messages.expected"); then
            echo "::error::messages.pot is stale -- re-run the pybabel extract, update and compile"
            exit 1
          fi
