# Набор гоняется дважды: в чистом окружении и во враждебном. Первый отвечает
# на вопрос «проходит ли свежий клон», второй — «проходит ли замусоренная
# машина так же». Разбор — docs/testing.md, «CI: набор гоняется
# дважды».

name: tests

on:
  # Каждая ветка и каждый тег: работа идёт в feature-ветках, которые сливают
  # локально, поэтому push — единственный гарантированный момент.
  push:
  # Кнопка появляется только для файлов из ветки по умолчанию.
  workflow_dispatch:

# Более новый push делает вердикт старого прогона ответом на вопрос, который
# уже никто не задаёт.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Ничего не пишется обратно. Объявлено явно: умолчание репозитория может быть
# read-write.
permissions:
  contents: read

jobs:
  suite:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      # Обе половины досчитывают до конца: «clean прошёл, hostile упал» — это
      # и есть диагноз.
      fail-fast: false
      matrix:
        mode: [clean, hostile]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Точная версия: после v7 действие перестало публиковать плавающие
        # мажорные теги, и `v9` не резолвится.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        # --locked, не --frozen: первый проверяет, что uv.lock согласован с
        # pyproject.toml, второй молча ставит что есть.
        run: uv sync --locked

      - name: Guard requirements.txt against uv.lock
        # requirements.txt генерируется из того же lock-файла и ставится в
        # образ через pip. Без сверки CI тестирует один набор пакетов, а образ
        # везёт другой.
        #
        # `grep -v '^#'` убирает двухстрочную шапку с командой генерации;
        # строки происхождения (`# via pkg`) с отступом и остаются в сравнении.
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project \
            --frozen --no-group browser > "$RUNNER_TEMP/requirements.expected"
          if ! diff -u <(grep -v '^#' requirements.txt) \
                       <(grep -v '^#' "$RUNNER_TEMP/requirements.expected"); then
            echo "::error::requirements.txt is stale -- re-run the uv export"
            exit 1
          fi

      - name: Pre-pull the test stack images
        # tests/support/real_stack.py даёт `compose up -d` 60 секунд.
        # Бюджет писался на машине, где образы уже были.
        run: docker compose -f dockers/docker-compose.test.yml pull --quiet

      - name: Pollute the environment
        if: matrix.mode == 'hostile'
        # Два канала утечки. Файл `.env` профильный загрузчик читает для всех
        # профилей, кроме testing. Экспортированные переменные выигрывают у
        # файла и доходят до процесса, даже когда файла нет.
        #
        # Значения выбраны такими, каких не объявляет ни один профиль: тест,
        # прочитавший любое из них, читает именно этот блок.
        #
        # DATABASE_URL — тот канал, через который утечка случилась. Тест,
        # попытавшийся им воспользоваться, падает на create_engine():
        # SQLAlchemy сопоставляет голому `postgresql://` драйвер psycopg2,
        # которого в проекте нет.
        run: |
          cp .env.example .env
          {
            echo "POPULAR_THRESHOLD=7"
            echo "RECENT_DAYS=3"
            echo "CACHE_LINK_TTL=77"
            echo "CACHE_STATS_TTL=13"
            echo "MAX_COLLISION_ATTEMPTS=9"
            echo "JWT_ACCESS_TOKEN_EXPIRE_MINUTES=11"
            echo "DEFAULT_RATE_LIMIT=37"
          } >> .env
          {
            echo "GUEST_LINK_LIMIT=1"
            echo "BATCH_CREATE_LIMIT=2"
            echo "DATABASE_URL=postgresql://prod/real"
            echo "SQLALCHEMY_ECHO=true"
            echo "DATABASE_POOL_SIZE=41"
            echo "DATABASE_MAX_OVERFLOW=43"
            echo "DATABASE_POOL_RECYCLE=47"
          } >> "$GITHUB_ENV"

      - name: Guard the number of tests
        env:
          # Нижняя граница, а не равенство. Добавление тестов правки не
          # требует, сокращение — требует, и это намеренно.
          #
          # Поднято вслед за набором: собирается 3171, и оставленный запас
          # означал бы, что столько тестов можно потерять молча. Зазор
          # прежний — восемь.
          MINIMUM_TESTS: 3163
        # `--error-for-skips` закрывает дверь «пропущен». Эта закрывает
        # соседнюю: тест, который вовсе не собрался, даёт «N passed» и код 0
        # при меньшем N. Механизмы тихие — имя вне `python_files`,
        # `collect_ignore` в conftest, каталог, который pytest не обходит.
        #
        # Код возврата проверяется до того, как счёту поверят: прерванный сбор
        # печатает собранное до прерывания и выходит с кодом 2.
        run: |
          if ! listing=$(uv run pytest tests/ -o addopts="" --collect-only -q); then
            echo "::error::collection did not finish; any count from it is a lie"
            printf '%s\n' "$listing" | tail -20
            exit 1
          fi
          collected=$(printf '%s\n' "$listing" | grep -c '::' || true)
          echo "collected $collected, minimum $MINIMUM_TESTS"
          if [ "$collected" -lt "$MINIMUM_TESTS" ]; then
            echo "::error::the suite lost tests: $collected < $MINIMUM_TESTS"
            exit 1
          fi

      - name: Run the suite
        # `-o addopts=""` снимает весь список из pyproject.toml: нужны отчёты
        # покрытия, а их здесь никто не читает. Строгость при этом не
        # страдает — strict_markers, strict_config и strict_xfail объявлены
        # ini-опциями, а не флагами.
        #
        # `--error-for-skips` превращает пропуск в отказ. Единственная ветка
        # пропуска в наборе — недоступный демон Docker: честный пропуск на
        # ноутбуке и дыра на раннере, где Docker обязан быть.
        run: >
          uv run pytest tests/ -q --no-cov -o addopts="" --tb=short
          --error-for-skips

      - name: Run the live surface check
        # 141 проверка по HTTP и единственное, что проходит по всем правилам
        # маршрутизации: прогон запоминает, какое правило ответило на каждый
        # запрос, и краснеет, если какое-то не задето. Он же проходит цепочку
        # подтверждения адреса через собственный SMTP-приёмник.
        #
        # Своих сервисов не поднимает: профиль testing игнорирует окружение,
        # поэтому обе половины матрицы дают один ответ.
        run: uv run python tests/live/smoke_test.py

      - name: Install the browser
        # Только на clean-половине: браузерный прогон ничего не читает из
        # окружения, а Chromium — сотня мегабайт на скачивание, и качать её
        # дважды ради одинакового ответа незачем.
        if: matrix.mode == 'clean'
        run: |
          uv sync --locked --group browser
          uv run playwright install --with-deps chromium

      - name: Run the browser check
        # 50 проверок настоящим браузером. Единственное, что вообще
        # исполняет web/static/js: остальной набор гоняет тестовый клиент
        # Flask, в котором нет движка, поэтому файлы страниц можно было
        # сломать целиком и остаться зелёным.
        if: matrix.mode == 'clean'
        run: uv run python tests/live/browser_test.py

  # Линтеры отдельной задачей и один раз: окружение не читает ни один из них.
  # Шаги раздельные, чтобы из сводки было видно, какой инструмент возразил.
  #
  # Чего здесь нет и почему — docs/testing.md, «CI: линтеры».
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: flake8
        # Настраивается файлом .flake8: pyproject.toml flake8 не читает.
        # `select = E9,F` оставляет дефекты и отбрасывает раскладку.
        run: uv run flake8 src tests

      - name: pylint
        # Порог `fail-under = 9.0` задан в pyproject.toml.
        run: uv run pylint src

      - name: bandit
        # Только src: `assert` для bandit находка, а для теста смысл
        # существования. Семь разобранных находок помечены `# nosec`.
        run: uv run bandit -r src -q

      - name: mypy
        # Настройки — секцией `[tool.mypy]` в pyproject.toml, порога нет:
        # ворота стоят на нуле ошибок. Здесь прогон всегда с нуля — кэша у
        # свежего клона нет; локально то же даёт
        # `rm -rf .mypy_cache && uv run mypy --no-incremental src`.
        run: uv run mypy src
