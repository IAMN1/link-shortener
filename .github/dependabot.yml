# Dependabot opens a pull request per update, and every one of them runs
# the full workflow -- the suite twice, the linters, the coverage floor.
# That is the point: an upgrade arrives already measured against this
# project rather than as a version bump to be trusted.
#
# There is one manifest here and no derived copy of it: the image exports
# its dependency list from `uv.lock` during the build. While a generated
# `requirements.txt` was checked in, Dependabot treated it as a manifest of
# its own and updated it apart from the lock -- 23 packages in the file and
# none in the lock, in the September 2026 group -- so every such pull
# request had to be repaired by hand.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # Grouped, because thirty direct dependencies at one PR each turns a
    # useful signal into a feed. A major version is left on its own: it is
    # the one that needs reading rather than merging.
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "build(ci)"
