<!-- Base template for all pages -->

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Кликер ссылок{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('frontend.static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('frontend.static', filename='css/nav.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <h1 class="logo">
                <a href="{{ url_for('frontend.index') }}">
                    <i class="fas fa-link"></i> Кликер
                </a>
            </h1>
            <div class="nav">
                <button class="nav-toggle" id="nav-toggle">
                    <i class="fas fa-bars"></i> Меню
                </button>
                <div class="nav-menu" id="nav-menu">
                    <div class="nav-item">
                        <a href="{{ url_for('frontend.stats') }}" class="nav-link">
                            <i class="fas fa-chart-bar"></i> Статистика
                        </a>
                    </div>
                    <div class="nav-item">
                        <a href="/api/docs" class="nav-link" target="_blank">
                            <i class="fas fa-code"></i> API
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 – Сервис коротких ссылок</p>
        </div>
    </footer>

    <script type="module" src="{{ url_for('frontend.static', filename='js/main.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const toggle = document.getElementById('nav-toggle');
            const menu = document.getElementById('nav-menu');
            if (toggle && menu) {
                toggle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    menu.classList.toggle('active');
                });
                document.addEventListener('click', function(event) {
                    if (!toggle.contains(event.target) && !menu.contains(event.target)) {
                        menu.classList.remove('active');
                    }
                });
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
