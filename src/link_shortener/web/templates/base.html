<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Кликер ссылок{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('frontend.static', filename='css/main.css') }}">
    <script type="module" src="{{ url_for('frontend.static', filename='js/main.js') }}" defer></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">
                <a href="{{ url_for('frontend.index') }}">
                    <i class="fas fa-link"></i> Кликер
                </a>
            </h1>
        </div>
    </header>

    <main class="main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 – Сервис коротких ссылок</p>
        </div>
    </footer>
</body>
</html>
