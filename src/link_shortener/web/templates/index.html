<!-- Main page template with mode selector and forms -->

{% extends "base.html" %}

{% block title %}Сократить ссылку{% endblock %}

{% block extra_head %}
    <link rel="stylesheet" href="{{ url_for('frontend.static', filename='css/index.css') }}">
{% endblock %}

{% block content %}
<section class="hero">
    <h2 class="hero__title">Сокращатель ссылок</h2>
    <p class="hero__subtitle">Выберите действие</p>
</section>

<div class="mode-selector">
    <button class="mode-btn active" data-mode="single">Одна ссылка</button>
    <button class="mode-btn" data-mode="batch">Несколько ссылок</button>
    <button class="mode-btn" data-mode="info">Информация</button>
    <button class="mode-btn" data-mode="extended">Расширенная</button>
</div>

<div id="mode-single" class="mode-content active">
    <form id="form-single" class="form">
        <div class="form__group">
            <label for="url-single" class="form__label">URL</label>
            <input type="url" name="url" id="url-single" class="form__input" 
                   placeholder="https://example.com/very/long/url" required>
        </div>
        <button type="submit" class="btn btn--primary btn--block">
            <span class="btn__text">Сократить</span>
            <span class="btn__spinner" style="display: none;"><i class="fas fa-spinner fa-spin"></i></span>
        </button>
    </form>
</div>

<div id="mode-batch" class="mode-content">
    <form id="form-batch" class="form">
        <div class="form__group">
            <label for="urls-batch" class="form__label">Список URL (каждый с новой строки)</label>
            <textarea name="urls" id="urls-batch" class="form__input" 
                      placeholder="https://example.com/1&#10;https://example.com/2"></textarea>
        </div>
        <button type="submit" class="btn btn--primary btn--block">
            <span class="btn__text">Сократить все</span>
            <span class="btn__spinner" style="display: none;"><i class="fas fa-spinner fa-spin"></i></span>
        </button>
    </form>
</div>

<div id="mode-info" class="mode-content">
    <form id="form-info" class="form">
        <div class="form__group">
            <label for="code-info" class="form__label">Короткий код</label>
            <input type="text" name="code" id="code-info" class="form__input" 
                   placeholder="abc123" required pattern="[A-Za-z0-9_-]{6,10}">
        </div>
        <button type="submit" class="btn btn--primary btn--block">
            <span class="btn__text">Получить информацию</span>
            <span class="btn__spinner" style="display: none;"><i class="fas fa-spinner fa-spin"></i></span>
        </button>
    </form>
</div>

<div id="mode-extended" class="mode-content">
    <form id="form-extended" class="form">
        <div class="form__group">
            <label for="code-extended" class="form__label">Короткий код</label>
            <input type="text" name="code" id="code-extended" class="form__input" 
                   placeholder="abc123" required pattern="[A-Za-z0-9_-]{6,10}">
        </div>
        <button type="submit" class="btn btn--primary btn--block">
            <span class="btn__text">Получить расширенную информацию</span>
            <span class="btn__spinner" style="display: none;"><i class="fas fa-spinner fa-spin"></i></span>
        </button>
    </form>
</div>

<div id="result" class="result" style="display: none;"></div>
{% endblock %}

{% block scripts %}
    <script type="module" src="{{ url_for('frontend.static', filename='js/index.js') }}"></script>
{% endblock %}
