<!-- Error page template -->

{% extends "base.html" %}

{% block title %}Ошибка{% endblock %}

{% block content %}
<section class="error">
    <h2>😕 Что-то пошло не так</h2>
    <p class="error__message">{{ error }}</p>
    <a href="{{ url_for('frontend.index') }}" class="btn">Вернуться на главную</a>
</section>
{% endblock %}
