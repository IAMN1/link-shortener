{% extends "layout/base.html" %}
{% block title %}Login – Linkr{% endblock %}
{% block content %}
<div class="auth-center">
    <div class="auth-card">
        <div class="card">
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-input" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" required autocomplete="current-password">
                </div>
                <div id="login-error" class="form-error hidden"></div>
                <button type="submit" class="btn btn--primary btn--block mt-1">Login</button>
            </form>
            <p>Don't have an account? <a href="{{ url_for('frontend.register_form') }}">Sign up</a></p>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('frontend.static', filename='js/pages/login.js') }}"></script>
{% endblock %}
