{% extends "layout/base.html" %}
{% block title %}Sign Up – Linkr{% endblock %}
{% block content %}
<div class="auth-center">
    <div class="auth-card">
        <div class="card">
            <h2>Create Account</h2>
            <div id="reg-sent" class="alert alert--success hidden"></div>
            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-input" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" required minlength="6" autocomplete="new-password">
                </div>
                <div id="reg-error" class="form-error hidden"></div>
                <button type="submit" class="btn btn--primary btn--block mt-1">Sign Up</button>
            </form>
            <p>Already have an account? <a href="{{ url_for('frontend.login_page') }}">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/pages/register.js') }}"></script>
{% endblock %}
