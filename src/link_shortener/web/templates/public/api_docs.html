{% extends "layout/base.html" %}
{% block title %}{{ doc.info.title }} — MaizLink{% endblock %}
{% block content %}
{# The page used to carry its own `<style>` block redefining `.api-op`,
   `.api-verb`, `.api-path` and `.api-status` -- the same class names the
   stylesheet already defines. The inline copy won, in hard-coded greys no
   theme could reach, so this page alone had no dark theme.

   It also printed every operation open, one after another: a single scroll
   ten and a half thousand pixels tall, with no table of contents, no
   anchors and nothing to collapse. Each operation is a `<details>` now,
   which is a disclosure that needs no script at all. #}
<div class="container">
    <h1>{{ doc.info.title }}</h1>
    <p class="text-muted mb-2 measure">{{ doc.info.description }}</p>

    <div class="api">
        <nav class="api-toc" aria-label="{{ _('Sections') }}">
            <div class="lab mb-1">{{ _('Sections') }}</div>
            {% for tag in doc.tags %}
            <a href="#tag-{{ tag.name }}">{{ tag.name }}</a>
            {% endfor %}
            <hr class="dropdown-divider">
            <a href="{{ url_for('frontend.openapi') }}">openapi.json</a>
        </nav>

        <div>
            <p class="text-sm text-muted mb-2 measure">
                {%- set document %}<a href="{{ url_for('frontend.openapi') }}"><code>/api/openapi.json</code></a>{% endset -%}
                {% trans link=document %}The machine-readable document is at {{ link }} — point Swagger UI, Redoc, Postman or a client generator at it. Nothing is bundled here: a megabyte and a half of vendored viewer, or a script tag pointing at somebody else's CDN, is not something a redirect service needs to carry.{% endtrans %}
            </p>

            {% for tag in doc.tags %}
            <section class="api-tag" id="tag-{{ tag.name }}">
                <h2>{{ tag.name }}</h2>
                <p>{{ tag.description }}</p>

                <div class="api-doc">
                    {% for path, operations in doc.paths.items() %}
                        {% for verb, operation in operations.items() %}
                            {% if tag.name in operation.tags %}
                            <details class="api-op">
                                <summary class="api-op-head">
                                    <span class="api-verb api-verb--{{ verb|lower }}">{{ verb }}</span>
                                    <span class="api-path">{{ path }}</span>
                                    <span class="api-op-summary">{{ operation.summary }}</span>
                                </summary>
                                <div class="api-op-body">
                                    {% if operation.description %}<p>{{ operation.description }}</p>{% endif %}

                                    {% if operation.parameters %}
                                    <div class="lab mb-1">{{ _('Parameters') }}</div>
                                    <table class="api-table">
                                        {% for parameter in operation.parameters %}
                                        <tr>
                                            <td>{{ parameter.name }}</td>
                                            <td>{{ parameter.in }}{% if parameter.required %}, {{ _('required') }}{% endif %}</td>
                                            <td>{{ parameter.description }}</td>
                                        </tr>
                                        {% endfor %}
                                    </table>
                                    {% endif %}

                                    <div class="lab mb-1 mt-1">{{ _('Answers') }}</div>
                                    <table class="api-table">
                                        {% for status, response in operation.responses.items() %}
                                        {# The first digit is the whole
                                           classification, so it is read
                                           rather than a table of codes
                                           kept in step by hand. A 302 gets
                                           the neutral dot: on this service
                                           a redirect is what success looks
                                           like, but it is not a 2xx and
                                           saying so would be a lie. #}
                                        {% set kind = {'2': ' dot--ok', '3': '', '4': ' dot--danger', '5': ' dot--danger'}.get(status[0], '') %}
                                        <tr>
                                            <td class="api-status">
                                                <span class="dot{{ kind }}"></span>{{ status }}
                                            </td>
                                            <td colspan="2">{{ response.description }}</td>
                                        </tr>
                                        {% endfor %}
                                    </table>
                                </div>
                            </details>
                            {% endif %}
                        {% endfor %}
                    {% endfor %}
                </div>
            </section>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
