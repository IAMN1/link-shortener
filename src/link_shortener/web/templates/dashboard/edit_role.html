{% extends "dashboard/base.html" %}
{% block title %}Edit Role – Linkr{% endblock %}
{% block dashboard_content %}
<h1 class="dash-title">Edit Role: {{ role.name }}</h1>

<div class="card" style="max-width:480px;">
    <form id="edit-role-form">
        <div class="form-group">
            <label class="form-label">Permissions</label>
            {% for perm in available_permissions %}
            <label style="display:block; margin-bottom:0.25rem;">
                <input type="checkbox" name="permissions" value="{{ perm }}"
                    {% if perm in role.permissions|map(attribute='name')|list %}checked{% endif %}>
                {{ perm }}
            </label>
            {% endfor %}
        </div>
        <div id="edit-role-error" class="form-error hidden"></div>
        <div class="flex gap-1 mt-1">
            <button type="submit" class="btn btn--primary">Save</button>
            <a href="{{ url_for('dashboard.roles_list') }}" class="btn btn--ghost">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
{% block page_scripts %}
<script src="{{ url_for('frontend.static', filename='js/pages/edit_role.js') }}"></script>
{% endblock %}
