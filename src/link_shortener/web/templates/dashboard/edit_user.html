{% extends "dashboard/base.html" %}
{% block title %}Edit User – Linkr{% endblock %}
{% block dashboard_content %}
<h1 class="dash-title">Edit User</h1>

<div class="card" style="max-width:480px;">
    <p class="text-sm text-muted mb-2">Editing: <strong>{{ user.email }}</strong></p>
    <form id="edit-user-form">
        <div class="form-group">
            <label class="form-label">Roles</label>
            {% for role in all_roles %}
            <label style="display:block; margin-bottom:0.25rem;">
                <input type="checkbox" name="roles" value="{{ role.name }}"
                    {% if role.name in user.roles|map(attribute='name')|list %}checked{% endif %}>
                {{ role.name }}
            </label>
            {% endfor %}
        </div>
        <div id="edit-user-error" class="form-error hidden"></div>
        <div class="flex gap-1 mt-1">
            <button type="submit" class="btn btn--primary">Save</button>
            <a href="{{ url_for('dashboard.users_list') }}" class="btn btn--ghost">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
{% block page_scripts %}
<script src="{{ url_for('static', filename='js/pages/edit_user.js') }}"></script>
{% endblock %}
