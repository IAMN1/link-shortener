{% extends "dashboard/base.html" %}
{% block title %}Service Stats – Linkr{% endblock %}
{% block dashboard_content %}
<h1 class="dash-title">Service Statistics</h1>

<div class="stats-grid mb-2">
    <div class="stat-card">
        <div class="stat-value" id="stat-total-urls">-</div>
        <div class="stat-label">Total URLs</div>
    </div>
    <div class="stat-card">
        <div class="stat-value" id="stat-total-clicks">-</div>
        <div class="stat-label">Total Clicks</div>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <span class="card-title">Top Links</span>
    </div>
    <div class="table-wrap">
        <table class="table">
            <thead>
                <tr><th>Short URL</th><th>Original</th><th>Clicks</th><th>Created</th></tr>
            </thead>
            <tbody id="popular-tbody"><tr><td colspan="4" class="text-muted text-center">Loading...</td></tr></tbody>
        </table>
    </div>
</div>
{% endblock %}
{% block page_scripts %}
<script src="{{ url_for('static', filename='js/pages/service_stats.js') }}"></script>
{% endblock %}
