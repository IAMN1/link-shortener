{% extends "dashboard/base.html" %}
{% block title %}Create Role – Linkr{% endblock %}
{% block dashboard_content %}
<h1 class="dash-title">Create Role</h1>

<div class="card" style="max-width:480px;">
    <form id="create-role-form">
        <div class="form-group">
            <label class="form-label" for="name">Name</label>
            <input type="text" id="name" class="form-input" required minlength="2" placeholder="e.g. editor">
        </div>
        <div class="form-group">
            <label class="form-label" for="description">Description</label>
            <input type="text" id="description" class="form-input" placeholder="Optional description">
        </div>
        <div class="form-group">
            <label class="form-label">Permissions</label>
            {% for perm in permissions %}
            <label style="display:block; margin-bottom:0.25rem;">
                <input type="checkbox" name="permissions" value="{{ perm }}"> {{ perm }}
            </label>
            {% endfor %}
        </div>
        <div id="create-role-error" class="form-error hidden"></div>
        <button type="submit" class="btn btn--primary btn--block mt-1">Create Role</button>
    </form>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('frontend.static', filename='js/pages/create_role.js') }}"></script>
{% endblock %}
