{% extends "dashboard/base.html" %}
{% block title %}My Links – Linkr{% endblock %}
{% block dashboard_content %}
<div class="flex items-center justify-between mb-2">
    <h1 class="dash-title" style="margin:0;">My Links</h1>
    <a href="{{ url_for('dashboard.create_link_form') }}" class="btn btn--primary btn--sm">+ New Link</a>
</div>

<div class="card">
    <div class="table-wrap">
        <table class="table">
            <thead>
                <tr>
                    <th>Short URL</th>
                    <th>Original</th>
                    <th>Clicks</th>
                    <th>Created</th>
                    <th>Expires</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="links-tbody"><tr><td colspan="6" class="text-muted text-center">Loading...</td></tr></tbody>
        </table>
    </div>
    <div id="links-empty" class="empty hidden">
        <div class="empty-icon">&#128279;</div>
        <p>No links yet. <a href="{{ url_for('dashboard.create_link_form') }}">Create your first link</a></p>
    </div>
</div>
{% endblock %}
{% block page_scripts %}
<script src="{{ url_for('frontend.static', filename='js/pages/my_links.js') }}"></script>
{% endblock %}
