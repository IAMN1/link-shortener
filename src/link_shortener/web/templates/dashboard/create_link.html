{% extends "dashboard/base.html" %}
{% block title %}Create Link — Linkr{% endblock %}
{% block dashboard_content %}
<h1 class="dash-title">Create Link</h1>

<div class="card narrow">
    <form id="create-link-form">
        <div class="form-group">
            <label class="form-label" for="url">Address</label>
            <input type="url" id="url" class="form-input" placeholder="https://example.com/very/long/url" required spellcheck="false">
        </div>
        <div class="form-group">
            <label class="form-label" for="ttl">Time to live</label>
            <select id="ttl" class="form-input">
                <option value="0">Never expires</option>
                <option value="3600">1 hour</option>
                <option value="86400">1 day</option>
                <option value="604800" selected>7 days</option>
                <option value="2592000">30 days</option>
            </select>
            <span class="form-hint">Links made without an account expire after 7 days.</span>
        </div>
        <div id="create-error" class="form-error hidden"></div>
        <button type="submit" class="btn btn--primary btn--block">Create</button>
    </form>
    <div id="create-result" class="hidden mt-2"></div>
</div>
{% endblock %}
{% block page_scripts %}
<script src="{{ url_for('static', filename='js/pages/create_link.js') }}" defer></script>
{% endblock %}
