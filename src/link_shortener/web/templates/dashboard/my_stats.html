{% extends "dashboard/base.html" %}
{% block title %}My Stats – Linkr{% endblock %}
{% block dashboard_content %}
<h1 class="dash-title">My Stats</h1>

<div class="stats-grid mb-2">
    <div class="stat-card">
        <div class="stat-value" id="stat-total-links">-</div>
        <div class="stat-label">Total Links</div>
    </div>
    <div class="stat-card">
        <div class="stat-value" id="stat-total-clicks">-</div>
        <div class="stat-label">Total Clicks</div>
    </div>
    <div class="stat-card">
        <div class="stat-value" id="stat-avg">-</div>
        <div class="stat-label">Avg Clicks/Link</div>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <span class="card-title">Recent Links</span>
    </div>
    <div class="table-wrap">
        <table class="table">
            <thead>
                <tr><th>Short URL</th><th>Original</th><th>Clicks</th><th>Created</th></tr>
            </thead>
            <tbody id="recent-tbody"><tr><td colspan="4" class="text-muted text-center">Loading...</td></tr></tbody>
        </table>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('frontend.static', filename='js/pages/my_stats.js') }}"></script>
{% endblock %}
