{% extends "admin/base_admin.html" %}
{% block admin_content %}
<h1>Пользователи</h1>
<a href="{{ url_for('admin_frontend.create_user_form') }}" class="btn">Создать пользователя</a>
<table class="table">
    <thead>
        <tr>
            <th>Email</th>
            <th>Активен</th>
            <th>Роли</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.email }}</td>
            <td>{{ user.is_active }}</td>
            <td>{{ user.roles | join(', ') }}</td>
            <td>
                <a href="{{ url_for('admin_frontend.edit_user', user_id=user.id) }}">Роли</a>
                <button onclick="deactivateUser('{{ user.id }}')">Деактивировать</button>
                <button onclick="deleteUser('{{ user.id }}')">Удалить</button>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
