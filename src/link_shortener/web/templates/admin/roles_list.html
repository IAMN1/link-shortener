{% extends "admin/base_admin.html" %}
{% block admin_content %}
<h1>Роли</h1>
<a href="{{ url_for('admin_frontend.create_role_form') }}" class="btn">Создать роль</a>
<table class="table">
    <thead>
        <tr>
            <th>Название</th>
            <th>Описание</th>
            <th>Системная?</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for role in roles %}
        <tr>
            <td>{{ role.name }}</td>
            <td>{{ role.description }}</td>
            <td>{{ role.is_system }}</td>
            <td>
                <a href="{{ url_for('admin_frontend.edit_role', role_name=role.name) }}">Разрешения</a>
                {% if not role.is_system %}
                    <button onclick="deleteRole('{{ role.name }}')">Удалить</button>
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
