{% extends "base.html" %}

{% block extra_head %}
    {{ super() }}
    <link rel="stylesheet" href="{{ url_for('frontend.static', filename='css/admin.css') }}">
{% endblock %}

{% block body %}
<div class="admin-layout">
    <nav class="admin-sidebar">
        <h2>Администрирование</h2>
        <ul>
            <li><a href="{{ url_for('admin_frontend.dashboard') }}">Панель</a></li>
            <li><a href="{{ url_for('admin_frontend.users_list') }}">Пользователи</a></li>
            <li><a href="{{ url_for('admin_frontend.roles_list') }}">Роли</a></li>
        </ul>
        <hr>
        <button id="logout-btn" style="background:none; border:none; color:#adb5bd; cursor:pointer;">Выйти</button>
    </nav>
    <main class="admin-content">
        {% block admin_content %}{% endblock %}
    </main>
</div>
{% endblock %}

{% block scripts %}
    {{ super() }}
    <script src="{{ url_for('frontend.static', filename='js/admin.js') }}"></script>
{% endblock %}
