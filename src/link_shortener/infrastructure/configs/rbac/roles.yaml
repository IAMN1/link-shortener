# ==============================================================================
# RBAC Configuration File: Roles and Permissions
# ==============================================================================
# This file defines the permissions and roles for the Role-Based Access Control
# (RBAC) system. It seeds the database through the `flask db load-base-roles`
# CLI command, which creates what is missing and leaves existing records
# alone: a role edited here does not reach a database that already holds it.
#
# File location: src/link_shortener/infrastructure/configs/rbac/roles.yaml
#
# Format: YAML
# Version: 1.0
# ==============================================================================

# ------------------------------------------------------------------------------
# PERMISSIONS
# ------------------------------------------------------------------------------
# A permission is a uniquely named action that can be performed on a resource.
# Each permission must have a unique `name` and defines the `resource` and
# `action` it grants. Permissions are reusable across multiple roles.
#
# Fields:
#   - name:        Unique identifier (e.g., "link:create"). Must be globally unique.
#                  Convention: "<resource>:<action>" (lowercase, underscore allowed).
#   - resource:    The domain entity or module the permission applies to
#                  (e.g., "link", "stats", "admin").
#   - action:      The specific operation allowed (e.g., "create", "view_own",
#                  "delete_any", "manage_users").
#   - description: Human-readable explanation of what the permission grants.
#                  Optional but highly recommended.
# ------------------------------------------------------------------------------
permissions:
  # --- Link Management ---
  - name: "link:create"
    resource: "link"
    action: "create"
    description: "Create a new short link"

  - name: "link:view_own"
    resource: "link"
    action: "view_own"
    description: "View details of links owned by the user"

  - name: "link:delete_own"
    resource: "link"
    action: "delete_own"
    description: "Delete links owned by the user"

  - name: "link:delete_any"
    resource: "link"
    action: "delete_any"
    description: "Delete any link in the system (administrative privilege)"

  # --- Statistics ---
  - name: "stats:view_basic"
    resource: "stats"
    action: "view_basic"
    description: "View basic service statistics (total URLs, total clicks)"

  - name: "stats:view_full"
    resource: "stats"
    action: "view_full"
    description: "View extended statistics including list of popular links"

  - name: "stats:view_any"
    resource: "stats"
    action: "view_any"
    description: "View detailed statistics of any link, not only one's own"

  # --- Journals ---
  # Two permissions rather than one, and neither of them under `admin`.
  # Reading a journal is not an administrative act -- the role that does it
  # is entitled to nothing else -- and the two journals are separated from
  # each other because they expose different things: `audit.log` carries
  # destination addresses and the accounts that followed them, while
  # `application.log` carries the email address of everyone who registered,
  # signed in, or failed to. Google Cloud draws the same line between
  # `logging.viewer` and `logging.privateLogViewer`.
  - name: "audit:view"
    resource: "audit"
    action: "view"
    description: "Read the audit journal, which records what was done to links and accounts"

  - name: "logs:view"
    resource: "logs"
    action: "view"
    description: "Read the application and error journals"

  # --- Administrative Functions ---
  - name: "admin:view_users"
    resource: "admin"
    action: "view_users"
    description: "View list of registered users"

  - name: "admin:manage_users"
    resource: "admin"
    action: "manage_users"
    description: "Create, update, activate/deactivate, or delete users"

  - name: "admin:view_roles"
    resource: "admin"
    action: "view_roles"
    description: "View existing roles and their assigned permissions"

  - name: "admin:manage_roles"
    resource: "admin"
    action: "manage_roles"
    description: "Create, update, or delete roles (system roles are protected)"

  # "and logs" used to stand at the end of this line and was never true:
  # the endpoint answers with the state of the database, the cache, the
  # queue and the failover counters, and no journal has ever been reachable
  # through it. Now that the journals have permissions of their own, the
  # wording would read as a grant.
  - name: "admin:view_system_health"
    resource: "admin"
    action: "view_system_health"
    description: "Access system health metrics"

  - name: "admin:all"
    resource: "admin"
    action: "all"
    description: "Full administrative access – bypasses all permission checks"

# ------------------------------------------------------------------------------
# ROLES
# ------------------------------------------------------------------------------
# A role is a named collection of permissions. Users are assigned one or more
# roles. Roles marked as `is_system: true` are protected and cannot be deleted
# via the admin panel (they can only be modified through this configuration file
# or direct database migrations).
#
# Fields:
#   - name:        Unique role identifier (e.g., "admin", "user", "analyst").
#                  Convention: lowercase, underscores allowed.
#   - description: Human-readable explanation of the role's purpose.
#   - is_system:   Boolean flag. If true, the role is considered a system role
#                  and cannot be deleted through the UI/API. Default is false.
#   - permissions: List of permission names (must reference names defined above)
#                  that this role grants.
# ------------------------------------------------------------------------------
roles:
  # Guest role – the role an unauthenticated request acts under.
  # It is assigned to no user: the authorization service answers anonymous
  # callers from this role directly. Whatever is listed here is additionally
  # capped by ANONYMOUS_PERMISSION_CEILING in rbac_authorization_service.py,
  # so widening this list alone cannot hand a permission to the internet.
  - name: "guest"
    description: "Unauthenticated visitor with minimal access"
    is_system: true
    permissions:
      - "stats:view_basic"
      - "link:create"

  # Default role assigned to newly registered users.
  - name: "user"
    description: "Regular registered user"
    is_system: true
    permissions:
      - "link:create"
      - "link:view_own"
      - "link:delete_own"
      - "stats:view_basic"

  # Analyst role – can view detailed statistics but cannot modify links.
  - name: "analyst"
    description: "Analyst with advanced statistics access"
    is_system: true
    permissions:
      - "link:view_own"
      - "stats:view_basic"
      - "stats:view_full"
      - "stats:view_any"

  # Auditor role – reads the record and changes nothing.
  #
  # It exists because the alternative is to hand somebody `admin` to let
  # them read a journal, and an administrator is the one person an audit
  # trail is kept against. NIST SP 800-53 AU-9(6) asks for read-only
  # authorisation to audit information for a subset of privileged users,
  # and PCI DSS 4.0 10.3.1 asks that the read be limited to those with a
  # job-related need; both are answered by a role that grants reading and
  # nothing else. Note what is absent: no `link:` permission, no
  # `admin:manage_*`, nothing that writes.
  - name: "auditor"
    description: "Reads the journals and the health report; changes nothing"
    is_system: true
    permissions:
      - "audit:view"
      - "logs:view"
      - "admin:view_system_health"

  # Administrator role – has full control over the system.
  - name: "admin"
    description: "System administrator with unrestricted access"
    is_system: true
    # One permission, and it is nearly the whole role: ``admin:all`` passes
    # every check but one, and it is also what identifies an administrator
    # to the guard that refuses to remove the last one. Listing the other
    # permissions here would grant nothing and read as though it did.
    #
    # The exception is ``audit:view``. An administrator holds every power
    # the audit journal exists to record, so a bypass that also handed them
    # the record would leave the journal proving nothing about the one
    # person it is kept against -- see ``BEYOND_ADMIN_ALL`` in
    # ``rbac_authorization_service.py``. An administrator who needs to read
    # it takes the ``auditor`` role, and taking it is itself an event.
    permissions:
      - "admin:all"
