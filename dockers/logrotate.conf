# ==============================================================================
# Ротация журналов приложения
# ==============================================================================
# Пути написаны от /logs: именно туда контейнер-ротатор монтирует каталог
# журналов (см. сервис logrotate в docker-compose.yml). Разворачивающему
# стек без Docker менять надо ровно одно — пути в заголовках двух блоков
# на абсолютные, например /srv/link-shortener/datas/logs/application.log,
# после чего файл кладётся в /etc/logrotate.d/.
#
# postrotate пуст намеренно, и блока здесь нет вовсе. Приложение пишет
# через RaisingWatchedFileHandler: перед каждой записью он сверяет
# устройство и inode пути с теми, что открыл, и, увидев подмену, открывает
# новый файл сам. Сигнал слать некому.
#
# copytruncate не используется. Он копирует файл и обрезает оригинал, и всё
# записанное между этими двумя действиями пропадает. Нужен он там, где
# приложение держит файл открытым и переоткрывать не умеет; здесь не тот
# случай, и платить его потерями не за что.
#
# create назван одним режимом, без владельца, и это единственная форма,
# верная и здесь, и на хосте. Без владельца logrotate берёт его у
# подменяемого файла, то есть у того, кто журнал и пишет — appuser, uid
# 1000 в образе приложения. Именем владельца не написать: ни в этом
# контейнере, ни на хосте такого пользователя нет. Числом — тоже:
# `create 0640 1000 1000` сборка logrotate под Debian встречает отказом
# «unknown user '1000'» и пропускает журнал целиком, а `logrotate` при этом
# возвращает ненулевой код, но файлы остаются расти.
#
# Ошибка здесь означает файл, в который приложению нельзя писать: запись
# отказывает, FailoverService считает отказ в dropped_calls, и увидеть это
# можно только в /api/v1/admin/health.
#
# Почему рядом нет ротации по самому большому файлу: журналы пишут четыре
# рабочих процесса gunicorn в один файл, и обработчик, который ротирует
# сам, при четырёх писателях уничтожает от 10 до 16 процентов записей —
# замер записан в docs/decisions.md.

# Журнал запросов и журнал ошибок: их пишет трафик, и растут они вместе с
# ним. Замер этого дерева — 796 байт на запрос, то есть 69 МБ в сутки при
# одном запросе в секунду и 690 МБ при десяти.
#
# Ежедневно и вдобавок по потолку: maxsize срабатывает только тогда, когда
# logrotate позвали до наступления суток, — ротатор зовёт его раз в час
# именно поэтому.
/logs/application.log
/logs/error.log {
    daily
    maxsize 100M
    rotate 14
    compress
    # Самый свежий архив остаётся несжатым до следующей ротации: тот, кто
    # дочитывает файл (Filebeat и подобные), успевает дочитать.
    delaycompress
    missingok
    notifempty
    create 0640
}

# Журнал аудита живёт дольше и по своим правилам. Он записывает, что
# сделали со ссылками и учётными записями, и это то, по чему
# восстанавливают инцидент, — а инцидент замечают не в тот же день.
#
# Растёт он не от трафика, а от событий: 750 байт на событие. Год хранения
# в сжатом виде — единицы мегабайт, поэтому потолок по размеру ему не
# ставится: обрезать по нему значило бы терять старые события ради места,
# которого он не занимает.
/logs/audit.log {
    weekly
    rotate 52
    compress
    delaycompress
    missingok
    notifempty
    create 0640
}
