# ==============================================================================
# Rotation of the application journals -- a template
# ==============================================================================
# This is a template rather than a finished configuration: the names of the
# three journals are substituted when the rotator container starts
# (dockers/logrotate-entrypoint.sh) from the same variables the application
# chooses them by -- LOG_FILENAME, ERROR_LOG_FILENAME and
# AUDIT_LOG_FILENAME.
#
# The names used to stand here literally. The application takes them from
# the environment and the journal reader in the panel takes them from the
# same place, so those two always agree; the rotator agreed only for as
# long as the defaults were left alone. A deployment had only to write
# LOG_FILENAME=journal and rotation quietly stopped working: missingok
# swallows the missing file, there is no failure, and the journal grows
# until the disk ends. A test holds the names against the tree's defaults
# (test_rotation_is_followed.py), but the defaults are not what a
# deployment is running.
#
# The paths are written from /logs: that is where the rotator container
# mounts the journal directory (see the logrotate service in
# docker-compose.yml). Deploying the stack without Docker takes exactly one
# change -- the paths in the two block headers become absolute, for example
# /srv/link-shortener/datas/logs/application.log -- after which the file
# goes into /etc/logrotate.d/.
#
# postrotate is deliberately empty, and there is no block for it at all.
# The application writes through RaisingWatchedFileHandler: before every
# record it compares the device and inode of the path with the ones it
# opened, and on seeing a replacement opens the new file itself. There is
# nobody to signal.
#
# copytruncate is not used. It copies the file and truncates the original,
# and everything written between those two actions is lost. It is needed
# where an application holds the file open and cannot reopen it; that is
# not the case here, and there is nothing to buy with its losses.
#
# create names one mode and no owner, and that is the only form correct
# both here and on a host. With no owner logrotate takes it from the file
# being replaced -- that is, from whoever writes the journal: appuser, uid
# 1000 in the application image. It cannot be written by name: no such user
# exists in this container or on a host. Nor by number: `create 0640 1000
# 1000` is met by the Debian build of logrotate with "unknown user '1000'",
# which skips the journal entirely -- `logrotate` returns a non-zero code
# and the files go on growing.
#
# A failure here means a file the application may not write to: the write
# is refused, FailoverService counts the refusal in dropped_calls, and the
# only place to see it is /api/v1/admin/health.
#
# Why there is no size-based rotation in the handler instead: four gunicorn
# workers write the journals into one file, and a handler that rotates by
# itself destroys between 10 and 16 percent of the records with four
# writers -- the measurement is recorded in docs/decisions.md.

# The request journal and the error journal: traffic writes them, and they
# grow with it. Measured on this tree -- 796 bytes per request, that is 69
# MB a day at one request a second and 690 MB at ten.
#
# Daily and by a ceiling as well: maxsize only fires when logrotate is
# called before the day is out, which is exactly why the rotator calls it
# once an hour.
/logs/${LOG_FILENAME}.log
/logs/${ERROR_LOG_FILENAME}.log {
    daily
    maxsize 100M
    rotate 14
    compress
    # The newest archive stays uncompressed until the next rotation, so
    # whoever is still reading the file (Filebeat and the like) can finish.
    delaycompress
    missingok
    notifempty
    create 0640
}

# The audit journal lives longer and by rules of its own. It records what
# was done to links and accounts, and it is what an incident is
# reconstructed from -- and an incident is not noticed the same day.
#
# It grows with traffic rather than apart from it: log_url_accessed is
# called on every redirect, in all three branches of redirect_link.
# Measured on this tree -- 473 bytes per redirect, that is 389 MB a day at
# ten redirects a second. This used to say "750 bytes per event" and "a
# year of retention compressed is a few megabytes"; both were wrong, and
# the error was a factor of a thousand.
#
# Hence the ceiling. Without it the live file reaches 2.7 GB at ten
# redirects a second under weekly rotation, and 13 GB at fifty -- and that
# is one file five processes are appending to. The gigabyte is chosen so
# that a year of retention survives: 200 generations of a gigabyte cover a
# year while traffic stays under ~14 redirects a second, and above that the
# generations run out early -- a limit of the design, not a setting.
#
# The disk it takes: 200 compressed generations of ~30 MB, about 6 GB, plus
# the live file. The compression ratio is measured on this tree and is
# 33.8 -- the records are uniform in the fields they carry.
/logs/${AUDIT_LOG_FILENAME}.log {
    weekly
    maxsize 1G
    rotate 200
    compress
    delaycompress
    missingok
    notifempty
    create 0640
}
