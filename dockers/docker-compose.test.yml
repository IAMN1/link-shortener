# Docker Compose for integration and E2E tests.
# Starts real PostgreSQL and Redis for level 2/3 testing.
#
# Usage:
#   docker compose -f dockers/docker-compose.test.yml up -d
#   uv run pytest tests/integration/docker/ -v
#   docker compose -f dockers/docker-compose.test.yml down -v

# A project name of its own, so the test stack does not collide with the
# main docker-compose.yml (see the comment there).
name: link-shortener-test

services:
  test-db:
    image: postgres:15-alpine
    container_name: shortener_test_db
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_shortener
    ports:
      # Bound to the loopback, as in the main stack. The passwords here are
      # common knowledge -- they are written a line above and in the
      # conftest -- so publishing on every interface would hand the database
      # and those credentials to the whole network. Tests and CI reach it
      # over localhost, so the binding does not concern them.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_shortener"]
      interval: 2s
      timeout: 3s
      retries: 10

  test-redis:
    image: redis:7-alpine
    container_name: shortener_test_redis
    command: redis-server --requirepass test_redis_pass --maxmemory 128mb
    ports:
      # The same reason as the test database above.
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "test_redis_pass", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
