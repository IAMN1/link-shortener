# ==============================================================================
# Разработческая надстройка над docker-compose.yml
# ==============================================================================
# Compose подхватывает этот файл автоматически, поэтому обычная команда
#
#   docker compose --env-file .env.docker up -d
#
# поднимает стек для разработки: dev-сервер с отладчиком и смонтированные
# исходники. Ничего в привычном порядке работы не меняется.
#
# Продакшн-стек — это база без надстройки, то есть явное перечисление файла:
#
#   docker compose -f dockers/docker-compose.yml --env-file .env.docker up -d
#
# Тогда приложение запускается CMD образа: gunicorn с потолком на запрос.
#
# Разделение нужно, чтобы dev-сервер не попадал в продакшн-форму: под
# `flask run --debug` не применяется закалка gunicorn (потолок на запрос), а
# интерактивный отладчик Werkzeug отвечает на `GET /console`.
# ==============================================================================

services:

    # Ловец писем: принимает SMTP на 1025, ничего не отправляет, всё
    # пойманное показывает на http://127.0.0.1:8025. Только в надстройке —
    # продакшн-стек submit'ит на настоящий сервер.
    #
    # Ловец, а не запись писем в файл: через него проходит тот же код, что и
    # в бою, — smtplib, диалог SMTP, сборка заголовков.
    #
    # TLS он не предлагает, и `DevelopmentConfig` это знает: MAIL_USE_TLS там
    # False. Пароль задавать нельзя — валидация конфигурации откажет, вместо
    # того чтобы отправить его открытым текстом.
    mailpit:
      image: axllent/mailpit:latest
      container_name: link_shortener_mailpit
      # Своя ловушка. Настоящий сервер задают MAIL_HOST и MAIL_PORT, профиль
      # при этом не включают. depends_on на неё не ставится: приложение
      # стартует и без почты.
      profiles: ["mail"]
      restart: unless-stopped
      # Обе петлевые: ящик хранит чужие адреса и ссылки подтверждения.
      ports:
        - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
        - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      environment:
        # Ящик живёт в памяти и исчезает вместе с контейнером.
        MP_MAX_MESSAGES: 500
      healthcheck:
        test: ["CMD", "/mailpit", "readyz"]
        interval: 10s
        timeout: 3s
        retries: 5

    migrations:
      volumes:
        # Ревизия, созданная внутри контейнера через `flask alembic migrate`,
        # сразу оказывается на хосте.
        #
        # `../`, потому что относительный путь compose отсчитывает от
        # каталога своего файла, а он теперь dockers/. Эти три лежат в
        # корне проекта.
        - ../alembic.ini:/app/alembic.ini
        - ../migrations:/app/migrations
        # Модели нужны Alembic для --autogenerate.
        - ../src:/app/src

    app:
      # Адрес ловушки. Здесь, а не в базовом файле: в продакшн-форме ловушки
      # нет, и MAIL_HOST там называет env-файл.
      #
      # Та же подстановка, что у REDIS_URL: пусто — ловушка из этого стека,
      # задано — настоящий сервер. Без неё контейнер получил бы умолчание
      # профиля `localhost`, то есть собственную петлю.
      environment:
        MAIL_HOST: ${MAIL_HOST:-mailpit}
        MAIL_PORT: ${MAIL_PORT:-1025}
      # !override обязателен: ports compose **сливает**, а не заменяет, и без
      # тега публикация из базового файла осталась бы рядом с петлевой.
      ports: !override
        # Только петля: отладчик Werkzeug — интерактивная консоль, и в сети
        # ей не место. Хостовая сторона отделена от контейнерной.
        - "127.0.0.1:${APP_HOST_PORT:-5000}:${PORT:-5000}"
      volumes:
        - ${APP_SRC_PATH}:/app/src
        - ${LOG_HOST_PATH}:/app/${LOG_DIR}
        # Без них `flask alembic ...` внутри контейнера падает с
        # "No 'script_location' key found". Пути от корня, см. выше.
        - ../alembic.ini:/app/alembic.ini
        - ../migrations:/app/migrations
      command: flask run --host=${HOST:-0.0.0.0} --port=${PORT:-5000} --debug

    celery_worker:
      # При CELERY_ENABLED=true письма уходят отсюда, и адрес ловушки нужен
      # воркеру не меньше, чем приложению.
      environment:
        MAIL_HOST: ${MAIL_HOST:-mailpit}
        MAIL_PORT: ${MAIL_PORT:-1025}
      volumes:
        - ${LOG_HOST_PATH}:/app/${LOG_DIR}
        # Исходники монтируются и воркеру, иначе он исполняет код из образа,
        # пока приложение работает по правке. Автоперезагрузки у Celery нет:
        # правка применяется через `docker compose restart celery_worker`.
        - ${APP_SRC_PATH}:/app/src
