
# Явное имя проекта. Без него compose берёт имя каталога, и этот стек
# оказывается в одном пространстве имён с docker-compose.test.yml: команды
# начинают ругаться на "orphan containers", `ps` показывает чужие сервисы,
# а `down -v` рискует снести тома соседнего стека.
name: link-shortener

# ==============================================================================
# Профили инфраструктуры
# ==============================================================================
# db, redis, redis_broker и mailpit поднимаются только тогда, когда их профиль
# назван. Набор задаётся переменной COMPOSE_PROFILES в том же env-файле:
#
#   COMPOSE_PROFILES=db,cache,broker,mail   весь стек свой
#   COMPOSE_PROFILES=                       всё внешнее: только migrations,
#                                           app и celery_worker
#
# Разовый выбор — флаг `docker compose --profile db up -d`.
#
# Внешние адреса задаются одной строкой каждый: DATABASE_URL, REDIS_URL,
# CELERY_BROKER_URL. Именно строкой, а не частями, — DATABASE_HOST ниже прибит
# к имени сервиса `db` и env-файлом не перекрывается: environment сильнее
# env_file.
#
# `required: false` у depends_on обязателен: без него выключенный профиль
# означает не «сервиса нет», а отказ разбора —
# `service "app" depends on undefined service "db"`. Порядок запуска при
# включённом профиле пометка сохраняет.
# ==============================================================================

services:

    # ==========================================================================
    # Alembic migration Service
    # ==========================================================================
    migrations:
      build:
        context: ..
        dockerfile: dockers/Dockerfile
      depends_on:
        db:
          condition: service_healthy
          required: false
      environment:
        PYTHONPATH: /app/src
        # Без умолчания: неназванный профиль миграция не считает выбором.
        # С `:-development` она приняла бы за выбор молчание и мигрировала
        # sqlite по умолчанию — пустой файл внутри одноразового контейнера.
        FLASK_ENV: ${FLASK_ENV}
        # `:?` отказывает на этапе рендера, до запуска чего бы то ни было.
        DATABASE_TYPE: ${DATABASE_TYPE:?задайте DATABASE_TYPE в env-файле}
        DATABASE_HOST: db
        # Внутри сети — порт образа, а не настройка хоста.
        DATABASE_PORT: ${DATABASE_PORT:-5432}
        DATABASE_NAME: ${DATABASE_NAME}
        DATABASE_USER: ${DATABASE_USER}
        DATABASE_PASSWORD: ${DATABASE_PASSWORD}
        DATABASE_POOL_PRE_PING: ${DATABASE_POOL_PRE_PING:-true}

        # Миграции не читают кэш и не ставят задач: лишние подключения ни к
        # чему.
        CACHE_ENABLED: "false"
        REDIS_ENABLED: "false"
        CELERY_ENABLED: "false"
        LOGGING_ENABLED: "false"
      env_file:
        # Тот же файл, что у app и celery_worker: DATABASE_URL живёт только
        # в нём, а get_database_url() отдаёт его в обход DATABASE_*. Без
        # env_file миграции пошли бы в другую базу, чем приложение.
        - ../${ENV_FILE:-.env}
      command: alembic upgrade head
      restart: "no"               # запускается один раз и завершается
      # Конфиг и ревизии Alembic лежат в образе. Монтирование каталогов —
      # разработческое удобство (новая ревизия сразу попадает на хост), и
      # живёт в docker-compose.override.yml.

    # ==========================================================================
    # PostgreSQL Database Service
    # ==========================================================================
    db:
      image: postgres:15-alpine
      container_name: shortener_db
      # Своя база. Внешнюю подключают одной строкой DATABASE_URL и этот
      # профиль не включают.
      profiles: ["db"]
      restart: unless-stopped
      environment:
        POSTGRES_USER: ${DATABASE_USER}
        POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
        POSTGRES_DB: ${DATABASE_NAME}
      # Порт внутри сети — тот же DATABASE_PORT, которым к базе обращается
      # приложение: одна величина вместо двух, способных разойтись.
      command: -p ${DATABASE_PORT:-5432}
      ports:
        # Три разные величины: адрес привязки, порт на хосте, порт внутри
        # сети. DATABASE_HOST_PORT двигают, когда порт на хосте занят, — на
        # адрес, по которому ходит приложение, это не влияет.
        #
        # Привязка по умолчанию петлевая. Публикация без адреса означает все
        # интерфейсы: «If you do not specify a host IP (such as 127.0.0.1),
        # Docker binds to all interfaces (0.0.0.0), bypassing host firewall
        # rules» (Compose file reference). DATABASE_BIND_ADDRESS расширяет
        # её, когда в базу нужно ходить с другой машины.
        - "${DATABASE_BIND_ADDRESS:-127.0.0.1}:${DATABASE_HOST_PORT:-5432}:${DATABASE_PORT:-5432}"
      volumes:
        # Каталог на хосте или именованный том: значение с '/' или './'
        # compose монтирует как каталог, всё остальное — как том.
        - ${DATABASE_DATA_PATH:-postgres_data}:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME} -p ${DATABASE_PORT:-5432}"]
        interval: 10s
        timeout: 5s
        retries: 5


    # ==========================================================================
    # Redis Cache Service
    # ==========================================================================
    # Только кэш и rate limiter. Всё, что здесь лежит, имеет TTL и переживать
    # вытеснение не обязано, поэтому allkeys-lru здесь уместен.
    redis:
      image: redis:7-alpine
      container_name: link_shortener_redis
      # Свой кэш. Внешний — REDIS_URL, и профиль не включают.
      profiles: ["cache"]
      command: redis-server --port ${REDIS_PORT:-6379} --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
      restart: unless-stopped
      ports:
        # Только петля: тот, кто может писать в кэш, получает открытый
        # редирект на произвольный адрес. Хостовый порт отделён от
        # внутрисетевого.
        - "127.0.0.1:${REDIS_HOST_PORT:-6379}:${REDIS_PORT:-6379}"
      volumes:
        - ${REDIS_DATA_PATH:-redis_data}:/data
      healthcheck:
        test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:-6379}", "-a", "${REDIS_PASSWORD}", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5
    # Аналогично: порт открыт для хоста, внутри сети доступен по имени "redis".


    # ==========================================================================
    # Redis Message Broker (Celery)
    # ==========================================================================
    # Отдельный инстанс, а не отдельная база: maxmemory-policy действует на
    # сервер целиком. С noeviction очередь либо принимается, либо отказывает
    # явно; в одной базе с кэшем она вытеснялась бы вместе с ним.
    redis_broker:
      image: redis:7-alpine
      container_name: link_shortener_redis_broker
      # Свой брокер. Внешний — CELERY_BROKER_URL, и профиль не включают.
      profiles: ["broker"]
      command: redis-server --port ${REDIS_BROKER_PORT:-6379} --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy noeviction
      restart: unless-stopped
      ports:
        # Слева порт на хосте, справа — внутри сети; обе величины задаются
        # своей переменной.
        - "127.0.0.1:${REDIS_BROKER_HOST_PORT:-6381}:${REDIS_BROKER_PORT:-6379}"
      volumes:
        - ${REDIS_BROKER_DATA_PATH:-redis_broker_data}:/data
      healthcheck:
        test: ["CMD", "redis-cli", "-p", "${REDIS_BROKER_PORT:-6379}", "-a", "${REDIS_PASSWORD}", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5


    # ==========================================================================
    # Application Service (Flask)
    # ==========================================================================
    app:
      build:
        context: ..
        dockerfile: dockers/Dockerfile
      container_name: link_shortener_app
      depends_on:
        db:
          condition: service_healthy
          required: false
        redis:
          condition: service_healthy
          required: false
        redis_broker:
          condition: service_healthy
          required: false
        # Без required: профиля у миграций нет, а запускать приложение на
        # непринятой схеме нельзя.
        migrations:
          condition: service_completed_successfully
      restart: unless-stopped
      ports:
        # Слева хостовый порт, справа — тот, который слушает контейнер.
        # Величины разные: правая следует за приложением (см. CMD образа),
        # левая двигается независимо.
        - "${APP_HOST_PORT:-5000}:${PORT:-5000}"
      environment:
        # Адреса переопределены на внутрисетевые.

        # ----- Flask / Application settings -----
        PYTHONPATH: /app/src
        FLASK_APP: link_shortener.web.app_factory:create_app
        FLASK_ENV: ${FLASK_ENV}
        FLASK_DEBUG: ${FLASK_DEBUG}
        
        SECRET_KEY: ${SECRET_KEY}
        SHORT_CODE_PEPPER: ${SHORT_CODE_PEPPER}

        # ----- Database settings -----
        DATABASE_TYPE: ${DATABASE_TYPE}
        DATABASE_HOST: db
        # Внутри сети — порт образа, а не настройка хоста.
        DATABASE_PORT: ${DATABASE_PORT:-5432}
        DATABASE_NAME: ${DATABASE_NAME}
        DATABASE_USER: ${DATABASE_USER}
        DATABASE_PASSWORD: ${DATABASE_PASSWORD}
        # Connection pool settings (for PostgreSQL)
        DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE}
        DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW}
        DATABASE_POOL_RECYCLE: ${DATABASE_POOL_RECYCLE}
        DATABASE_POOL_PRE_PING: ${DATABASE_POOL_PRE_PING}
        DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT}
        DATABASE_STATEMENT_TIMEOUT: ${DATABASE_STATEMENT_TIMEOUT}

        # ----- Redis / Cache settings -----
        CACHE_ENABLED: ${CACHE_ENABLED}

        REDIS_ENABLED: ${REDIS_ENABLED:-}
        # Пусто — Redis из этого стека, задано — любой внешний. Подстановка
        # обязательна: environment сильнее env_file, и без неё значение из
        # env-файла до контейнера не долетает.
        REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT:-6379}/0}
        REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT}
        REDIS_SOCKET_TIMEOUT: ${REDIS_SOCKET_TIMEOUT}
        REDIS_RETRY_INTERVAL: ${REDIS_RETRY_INTERVAL}

        # ----- Logging & Audit settings -----
        LOGGING_ENABLED: ${LOGGING_ENABLED}
        AUDIT_ENABLED: ${AUDIT_ENABLED}
        LOG_LEVEL: ${LOG_LEVEL}
        LOG_TO_CONSOLE: ${LOG_TO_CONSOLE:-}
        LOG_TO_FILE: ${LOG_TO_FILE:-}
        LOG_DIR: ${LOG_DIR}
        LOG_FILENAME: ${LOG_FILENAME}
        
        # ----- Celery settings -----
        CELERY_ENABLED: ${CELERY_ENABLED}
        # Та же подстановка, что у REDIS_URL: брокер может быть внешним.
        CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD}@redis_broker:${REDIS_BROKER_PORT:-6379}/0}
        CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD}@redis_broker:${REDIS_BROKER_PORT:-6379}/0}
        CELERY_BROKER_TIMEOUT: ${CELERY_BROKER_TIMEOUT}
        HEALTH_CHECK_TIMEOUT: ${HEALTH_CHECK_TIMEOUT}

        # ----- Performance / Workers -----
        # Потолок на запрос — единственное, что прерывает обращение к
        # зависшей (а не упавшей) БД: замороженный сервер не выполняет свой
        # statement_timeout, а его ядро подтверждает TCP-keepalive.
        # GUNICORN_WORKER_CLASS обязан остаться sync: у gthread --timeout
        # запрос не прерывает.
        GUNICORN_WORKERS: ${GUNICORN_WORKERS}
        GUNICORN_WORKER_CLASS: ${GUNICORN_WORKER_CLASS:-sync}
        GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
        GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-20}
      
      env_file:
        # Загружает все переменные, но environment имеет приоритет.
        # ENV_FILE позволяет держать отдельные наборы: .env — локальный запуск
        # без Docker, .env.docker — этот стек. Значение задаётся внутри самого
        # файла окружения, поэтому достаточно одного флага:
        #   docker compose --env-file .env.docker up -d
        - ../${ENV_FILE:-.env}
      volumes:
        # Журналы остаются на хосте.
        - ${LOG_HOST_PATH}:/app/${LOG_DIR}
      # Команда не задана намеренно: работает CMD образа — gunicorn с
      # потолком на запрос. Разработческий вариант (`flask run --debug`,
      # смонтированные исходники) лежит в docker-compose.override.yml,
      # который compose подхватывает сам.
      healthcheck:
        # timeout= обязателен: без него у urlopen нет собственного срока, и
        # проба переживает timeout ниже — её убивают вместо ответа.
        # Порт берётся из PORT, а не прибит к 5000: иначе смена порта
        # приложения превращает healthcheck в вечный отказ.
        test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:%s/health' % os.environ.get('PORT', '5000'), timeout=8)\""]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 15s


    # ==========================================================================
    # Celery
    # ==========================================================================
    celery_worker:
      build:
        context: ..
        dockerfile: dockers/Dockerfile
      container_name: link_shortener_celery
      depends_on:
        db:
          condition: service_healthy
          required: false
        redis:
          condition: service_healthy
          required: false
        redis_broker:
          condition: service_healthy
          required: false
      restart: unless-stopped
      environment:
        # Общие настройки
        PYTHONPATH: /app/src
        FLASK_ENV: ${FLASK_ENV}
        FLASK_DEBUG: ${FLASK_DEBUG}
        SECRET_KEY: ${SECRET_KEY}
        SHORT_CODE_PEPPER: ${SHORT_CODE_PEPPER}
        
        # База данных – внутри сети используем имя сервиса db
        DATABASE_TYPE: ${DATABASE_TYPE}
        DATABASE_HOST: db
        # Внутри сети — порт образа, а не настройка хоста.
        DATABASE_PORT: ${DATABASE_PORT:-5432}
        DATABASE_NAME: ${DATABASE_NAME}
        DATABASE_USER: ${DATABASE_USER}
        DATABASE_PASSWORD: ${DATABASE_PASSWORD}
        DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE}
        DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW}
        DATABASE_POOL_RECYCLE: ${DATABASE_POOL_RECYCLE}
        DATABASE_POOL_PRE_PING: ${DATABASE_POOL_PRE_PING}
        DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT}
        DATABASE_STATEMENT_TIMEOUT: ${DATABASE_STATEMENT_TIMEOUT}
        
        # Redis – внутри сети
        CACHE_ENABLED: ${CACHE_ENABLED}

        REDIS_ENABLED: ${REDIS_ENABLED:-}
        # Пусто — Redis из этого стека, задано — любой внешний. Подстановка
        # обязательна: environment сильнее env_file, и без неё значение из
        # env-файла до контейнера не долетает.
        REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT:-6379}/0}
        REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT}
        REDIS_SOCKET_TIMEOUT: ${REDIS_SOCKET_TIMEOUT}
        REDIS_RETRY_INTERVAL: ${REDIS_RETRY_INTERVAL}
        
        # Логирование
        LOGGING_ENABLED: ${LOGGING_ENABLED}
        AUDIT_ENABLED: ${AUDIT_ENABLED}
        LOG_LEVEL: ${LOG_LEVEL}
        LOG_TO_CONSOLE: ${LOG_TO_CONSOLE:-}
        LOG_TO_FILE: ${LOG_TO_FILE:-}
        LOG_DIR: ${LOG_DIR}
        LOG_FILENAME: ${LOG_FILENAME}
        
        # Celery
        CELERY_ENABLED: ${CELERY_ENABLED}
        # Та же подстановка, что у REDIS_URL: брокер может быть внешним.
        CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD}@redis_broker:${REDIS_BROKER_PORT:-6379}/0}
        CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD}@redis_broker:${REDIS_BROKER_PORT:-6379}/0}
        CELERY_BROKER_TIMEOUT: ${CELERY_BROKER_TIMEOUT}
        HEALTH_CHECK_TIMEOUT: ${HEALTH_CHECK_TIMEOUT}
      
      env_file:
        # Тот же файл, что у app: воркер пишет в тот же кэш и ту же базу, и
        # без env_file брал бы умолчания из кода на всё, что не перечислено
        # выше. environment остаётся главнее и удерживает адреса внутри сети.
        - ../${ENV_FILE:-.env}
      command: celery -A link_shortener.infrastructure.task_queue.celery_app worker --loglevel=info
      volumes:
        - ${LOG_HOST_PATH}:/app/${LOG_DIR}
    # Для сценария 1 (приложение на хосте) – воркер всё равно запускается в контейнере.
    # Для сценария 2 (всё в Docker) – воркер работает в контейнере.
    # Для сценария 3 (приложение в контейнере, остальное на хосте) – если не нужен, можно не запускать.


volumes:
  postgres_data:
  redis_data:
  redis_broker_data:
