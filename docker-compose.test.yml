# Docker Compose for integration and E2E tests.
# Starts real PostgreSQL and Redis for level 2/3 testing.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   uv run pytest tests/integration/docker/ -v
#   docker compose -f docker-compose.test.yml down -v

# Отдельное имя проекта, чтобы тестовый стек не пересекался с основным
# docker-compose.yml (см. комментарий там).
name: link-shortener-test

services:
  test-db:
    image: postgres:15-alpine
    container_name: shortener_test_db
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_shortener
    ports:
      # На петлю, как и в основном стеке. Пароли здесь общеизвестны -- они
      # записаны строкой выше и в conftest'е, — так что публикация на все
      # интерфейсы отдавала бы базу с этими учётными данными всей сети.
      # Тесты и CI ходят сюда через localhost, так что привязка их не
      # касается.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_shortener"]
      interval: 2s
      timeout: 3s
      retries: 10

  test-redis:
    image: redis:7-alpine
    container_name: shortener_test_redis
    command: redis-server --requirepass test_redis_pass --maxmemory 128mb
    ports:
      # Та же причина, что и у тестовой базы выше.
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "test_redis_pass", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
