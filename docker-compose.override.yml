# ==============================================================================
# Разработческая надстройка над docker-compose.yml
# ==============================================================================
# Compose подхватывает этот файл автоматически, поэтому обычная команда
#
#   docker compose --env-file .env.docker up -d
#
# поднимает стек для разработки: dev-сервер с отладчиком и смонтированные
# исходники. Ничего в привычном порядке работы не меняется.
#
# Продакшн-стек — это база без надстройки, то есть явное перечисление файла:
#
#   docker compose -f docker-compose.yml --env-file .env.docker up -d
#
# Тогда приложение запускается CMD образа: gunicorn с потолком на запрос.
#
# Зачем разделение. Раньше `command` был прописан прямо в базовом файле, и
# документированная команда запуска поднимала dev-сервер Werkzeug с
# `--debug` на `0.0.0.0`. Проверено на живом стеке: `GET /console` отвечал
# `200` и отдавал `debugger.js`. Два следствия, оба измеренные:
#   * вся закалка gunicorn не применялась — при замороженной БД запрос висел
#     150 с против ~31 с под gunicorn с `--timeout 30`;
#   * интерактивный отладчик был доступен из локальной сети, тогда как Redis
#     в том же файле уже был аккуратно привязан к петле.
# ==============================================================================

services:

    # Ловец писем: принимает SMTP на 1025 и никуда ничего не отправляет,
    # всё пойманное показывает на http://127.0.0.1:8025. Только здесь, в
    # надстройке — продакшн-стек submit'ит на настоящий сервер.
    #
    # Почему ловец, а не запись писем в файл: через него проходит ровно тот
    # код, который работает в бою, — `smtplib`, диалог SMTP, сборка
    # заголовков. Ветка «в dev пишем в файл» этот путь не проверяет и потому
    # ломается незаметно.
    #
    # TLS ловец не предлагает, и `DevelopmentConfig` это знает:
    # `MAIL_USE_TLS` там по умолчанию False. Пароля здесь нет — а если
    # разработчик его задаст, валидация конфигурации откажет, вместо того
    # чтобы отправить его открытым текстом.
    mailpit:
      image: axllent/mailpit:latest
      container_name: link_shortener_mailpit
      restart: unless-stopped
      # Обе петлевые: почтовый ящик разработчика с чужими адресами и
      # ссылками подтверждения — не то, что стоит показывать локальной сети.
      ports:
        - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
        - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      environment:
        # Ящик живёт в памяти и исчезает вместе с контейнером: письма
        # разработки не данные, а хранить ссылки подтверждения на диске
        # дольше их срока жизни незачем.
        MP_MAX_MESSAGES: 500
      healthcheck:
        test: ["CMD", "/mailpit", "readyz"]
        interval: 10s
        timeout: 3s
        retries: 5

    migrations:
      volumes:
        # Разработческое удобство: ревизия, созданная внутри контейнера
        # через `flask alembic migrate`, сразу оказывается на хосте.
        - ./alembic.ini:/app/alembic.ini
        - ./migrations:/app/migrations
        # Модели нужны Alembic для --autogenerate.
        - ./src:/app/src

    app:
      # !override, а не просто список: compose **сливает** ports, а не
      # заменяет. Без тега публикация `0.0.0.0` из базового файла остаётся
      # рядом с петлевой, и отладчик по-прежнему виден из сети — проверено,
      # первая версия этой надстройки именно так и не работала.
      ports: !override
        # Только петля. Отладчик Werkzeug — интерактивная консоль; публикация
        # на 0.0.0.0 выставляла её в локальную сеть. Продакшн-файл публикует
        # порт как раньше: там отладчика нет.
        # Хостовая сторона отделена от контейнерной — как в базовом файле.
        - "127.0.0.1:${APP_HOST_PORT:-5000}:${PORT:-5000}"
      volumes:
        - ${APP_SRC_PATH}:/app/src
        - ${LOG_HOST_PATH}:/app/${LOG_DIR}
        # Без них группа команд `flask alembic ...` внутри контейнера падает
        # с "No 'script_location' key found".
        - ./alembic.ini:/app/alembic.ini
        - ./migrations:/app/migrations
      command: flask run --host=0.0.0.0 --port=${PORT:-5000} --debug

    celery_worker:
      volumes:
        - ${LOG_HOST_PATH}:/app/${LOG_DIR}
        # Исходники монтируются и воркеру. Без этого он исполнял код из
        # образа: правка подхватывалась приложением и не подхватывалась им,
        # `restart` не помогал, требовалась пересборка — и пока её не
        # сделали, две половины сервиса работали на разных версиях.
        # Автоперезагрузки у Celery нет, поэтому правку по-прежнему нужно
        # применить: теперь достаточно `docker compose restart celery_worker`.
        - ${APP_SRC_PATH}:/app/src
