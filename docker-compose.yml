
services:

    # ==========================================================================
    # Alembic migration Service
    # ==========================================================================
    migrations:
      build: .
      depends_on:
        db:
          condition: service_healthy
      environment:
        PYTHONPATH: /app/src
        FLASK_ENV: ${FLASK_ENV:-development}
        DATABASE_TYPE: ${DATABASE_TYPE}
        DATABASE_HOST: db
        DATABASE_PORT: ${DATABASE_PORT}
        DATABASE_NAME: ${DATABASE_NAME}
        DATABASE_USER: ${DATABASE_USER}
        DATABASE_PASSWORD: ${DATABASE_PASSWORD}
        DATABASE_POOL_PRE_PING: ${DATABASE_POOL_PRE_PING:-true}

        CACHE_ENABLED: "false"   # отключаем кэш, чтобы избежать лишних подключений
        REDIS_ENABLED: "false"
        CELERY_ENABLED: "false"
        LOGGING_ENABLED: "false"  # можно отключить логирование для миграций
      command: alembic upgrade head
      restart: "no"               # запускается один раз и завершается
      volumes:
        - ./alembic.ini:/app/alembic.ini
        - ./migrations:/app/migrations   # монтируем папку миграций для доступа к файлам
        # Монтируем исходники, чтобы Alembic видел модели (если используете --autogenerate)
        - ./src:/app/src

    # ==========================================================================
    # PostgreSQL Database Service
    # ==========================================================================
    db: 
      image: postgres:15-alpine
      container_name: shortener_db
      restart: unless-stopped
      environment:
        POSTGRES_USER: ${DATABASE_USER}
        POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
        POSTGRES_DB: ${DATABASE_NAME}
      ports:
        - "${DATABASE_PORT}:5432"                   # Проброс порта для доступа с хоста
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
        interval: 10s
        timeout: 5s
        retries: 5
    # Для сценария 1 (приложение на хосте) – порт открыт, приложение подключается по localhost.
    # Для сценария 2 (всё в Docker) – приложение в контейнере будет использовать имя "db".


    # ==========================================================================
    # Redis Cache Service & Message Broker
    # ==========================================================================
    redis:
      image: redis:7-alpine
      container_name: link_shortener_redis
      command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
      restart: unless-stopped
      ports:
        - "${REDIS_PORT}:6379"
      volumes:
        - redis_data:/data
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5
    # Аналогично: порт открыт для хоста, внутри сети доступен по имени "redis".


    # ==========================================================================
    # Application Service (Flask)
    # ==========================================================================
    app:
      build: .
      container_name: link_shortener_app
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
        migrations:
          condition: service_completed_successfully
      restart: unless-stopped
      ports:
        - "${PORT}:5000"
      environment:
        # Все переменные переопределены для работы внутри сети

        # ----- Flask / Application settings -----
        PYTHONPATH: /app/src
        FLASK_APP: link_shortener.web.app_factory:create_app
        FLASK_ENV: ${FLASK_ENV}
        FLASK_DEBUG: ${FLASK_DEBUG}
        
        SECRET_KEY: ${SECRET_KEY}
        SHORT_CODE_PEPPER: ${SHORT_CODE_PEPPER}

        # ----- Database settings -----
        DATABASE_TYPE: ${DATABASE_TYPE}
        DATABASE_HOST: db
        DATABASE_PORT: ${DATABASE_PORT}
        DATABASE_NAME: ${DATABASE_NAME}
        DATABASE_USER: ${DATABASE_USER}
        DATABASE_PASSWORD: ${DATABASE_PASSWORD}
        # Connection pool settings (for PostgreSQL)
        DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE}
        DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW}
        DATABASE_POOL_RECYCLE: ${DATABASE_POOL_RECYCLE}
        DATABASE_POOL_PRE_PING: ${DATABASE_POOL_PRE_PING}

        # ----- Redis / Cache settings -----
        CACHE_ENABLED: ${CACHE_ENABLED}

        REDIS_ENABLED: ${REDIS_ENABLED}
        REDIS_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/0
        REDIS_PORT: ${REDIS_PORT}
        REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT}
        REDIS_SOCKET_TIMEOUT: ${REDIS_SOCKET_TIMEOUT}
        REDIS_RETRY_INTERVAL: ${REDIS_RETRY_INTERVAL}

        # ----- Logging & Audit settings -----
        LOGGING_ENABLED: ${LOGGING_ENABLED}
        AUDIT_ENABLED: ${AUDIT_ENABLED}
        LOG_LEVEL: ${LOG_LEVEL}
        LOG_TO_CONSOLE: ${LOG_TO_CONSOLE}
        LOG_TO_FILE: ${LOG_TO_FILE}
        LOG_DIR: ${LOG_DIR}
        LOG_FILENAME: ${LOG_FILENAME}
        
        # ----- Celery settings -----
        CELERY_ENABLED: ${CELERY_ENABLED}
        CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/0
        CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/0

        # ----- Performance / Workers -----
        GUNICORN_WORKERS: ${GUNICORN_WORKERS}
      
      env_file:
        - .env # Загружает все переменные, но environment имеет приоритет
      volumes:
        # Mount source code for development (hot reload)
        - ${APP_SRC_PATH}:/app/src
        
        # Mount logs directory to persist logs on host
        - ${LOG_HOST_PATH}:/app/${LOG_DIR}
      command: flask run --host=0.0.0.0 --port=${PORT} --debug


    # ==========================================================================
    # Celery
    # ==========================================================================
    celery_worker:
      build: .
      container_name: link_shortener_celery
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
      restart: unless-stopped
      environment:
        # Общие настройки
        PYTHONPATH: /app/src
        FLASK_ENV: ${FLASK_ENV}
        FLASK_DEBUG: ${FLASK_DEBUG}
        SECRET_KEY: ${SECRET_KEY}
        SHORT_CODE_PEPPER: ${SHORT_CODE_PEPPER}
        
        # База данных – внутри сети используем имя сервиса db
        DATABASE_TYPE: ${DATABASE_TYPE}
        DATABASE_HOST: db
        DATABASE_PORT: ${DATABASE_PORT}
        DATABASE_NAME: ${DATABASE_NAME}
        DATABASE_USER: ${DATABASE_USER}
        DATABASE_PASSWORD: ${DATABASE_PASSWORD}
        DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE}
        DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW}
        DATABASE_POOL_RECYCLE: ${DATABASE_POOL_RECYCLE}
        DATABASE_POOL_PRE_PING: ${DATABASE_POOL_PRE_PING}
        
        # Redis – внутри сети
        CACHE_ENABLED: ${CACHE_ENABLED}

        REDIS_ENABLED: ${REDIS_ENABLED}
        REDIS_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/0
        REDIS_PORT: ${REDIS_PORT}
        REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT}
        REDIS_SOCKET_TIMEOUT: ${REDIS_SOCKET_TIMEOUT}
        REDIS_RETRY_INTERVAL: ${REDIS_RETRY_INTERVAL}
        
        # Логирование
        LOGGING_ENABLED: ${LOGGING_ENABLED}
        AUDIT_ENABLED: ${AUDIT_ENABLED}
        LOG_LEVEL: ${LOG_LEVEL}
        LOG_TO_CONSOLE: ${LOG_TO_CONSOLE}
        LOG_TO_FILE: ${LOG_TO_FILE}
        LOG_DIR: ${LOG_DIR}
        LOG_FILENAME: ${LOG_FILENAME}
        
        # Celery
        CELERY_ENABLED: ${CELERY_ENABLED}
        CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/0
        CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/0
      
      command: celery -A link_shortener.infrastructure.task_queue.celery_app worker --loglevel=info
      volumes:
        - ${LOG_HOST_PATH}:/app/${LOG_DIR}
    # Для сценария 1 (приложение на хосте) – воркер всё равно запускается в контейнере.
    # Для сценария 2 (всё в Docker) – воркер работает в контейнере.
    # Для сценария 3 (приложение в контейнере, остальное на хосте) – если не нужен, можно не запускать.


volumes:
  postgres_data:
  redis_data:
