
# Явное имя проекта. Без него compose берёт имя каталога, и этот стек
# оказывается в одном пространстве имён с docker-compose.test.yml: команды
# начинают ругаться на "orphan containers", `ps` показывает чужие сервисы,
# а `down -v` рискует снести тома соседнего стека.
name: link-shortener

services:

    # ==========================================================================
    # Alembic migration Service
    # ==========================================================================
    migrations:
      build: .
      depends_on:
        db:
          condition: service_healthy
      environment:
        PYTHONPATH: /app/src
        FLASK_ENV: ${FLASK_ENV:-development}
        DATABASE_TYPE: ${DATABASE_TYPE}
        DATABASE_HOST: db
        # Внутри сети — порт образа, а не настройка хоста.
        DATABASE_PORT: 5432
        DATABASE_NAME: ${DATABASE_NAME}
        DATABASE_USER: ${DATABASE_USER}
        DATABASE_PASSWORD: ${DATABASE_PASSWORD}
        DATABASE_POOL_PRE_PING: ${DATABASE_POOL_PRE_PING:-true}

        CACHE_ENABLED: "false"   # отключаем кэш, чтобы избежать лишних подключений
        REDIS_ENABLED: "false"
        CELERY_ENABLED: "false"
        LOGGING_ENABLED: "false"  # можно отключить логирование для миграций
      env_file:
        # Тот же файл, что у app и celery_worker. Без него сервис получал
        # только перечисленное выше, а `migrations/env.py` строит полную
        # конфигурацию приложения — включая проверки профиля. В продакшн-форме
        # это означало отказ ещё до подключения к БД: «SECRET_KEY must be set»,
        # затем «DOMAIN must be set». Миграции не выполнялись, а `app` ждёт их
        # успешного завершения — весь стек не поднимался.
        # Вторая половина: DATABASE_URL документирован и живёт только в файле
        # окружения, а get_database_url() отдаёт его в обход DATABASE_*. Без
        # env_file миграции шли в одну базу, а приложение работало с другой.
        - ${ENV_FILE:-.env}
      command: alembic upgrade head
      restart: "no"               # запускается один раз и завершается
      # Конфиг и ревизии Alembic лежат в образе. Монтирование каталогов —
      # разработческое удобство (новая ревизия сразу попадает на хост), и
      # живёт в docker-compose.override.yml.

    # ==========================================================================
    # PostgreSQL Database Service
    # ==========================================================================
    db: 
      image: postgres:15-alpine
      container_name: shortener_db
      restart: unless-stopped
      environment:
        POSTGRES_USER: ${DATABASE_USER}
        POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
        POSTGRES_DB: ${DATABASE_NAME}
      ports:
        # Хостовый порт и порт внутри сети — разные величины. Внутри сети
        # PostgreSQL всегда слушает 5432: это порт образа, а не настройка
        # приложения, и менять его незачем. Наружу публикуется
        # DATABASE_HOST_PORT — его можно двигать, когда 5432 на хосте занят,
        # и это больше не ломает healthcheck и адрес, по которому ходит
        # приложение.
        #
        # Адрес привязки — третья величина, и раньше её тут не было.
        # Публикация без адреса означает все интерфейсы: «If you do not
        # specify a host IP (such as 127.0.0.1), Docker binds to all
        # interfaces (0.0.0.0), bypassing host firewall rules» (Compose
        # file reference). Умолчание поэтому петля, как у обоих Redis; база хранит
        # больше, чем кэш, и меньше всего заслуживает более широкой
        # привязки, чем они. DATABASE_BIND_ADDRESS её расширяет, когда
        # оператору нужно ходить в базу с другой машины: значение 0.0.0.0
        # возвращает прежнее поведение, но уже как решение, а не как
        # умолчание.
        - "${DATABASE_BIND_ADDRESS:-127.0.0.1}:${DATABASE_HOST_PORT:-5432}:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
        interval: 10s
        timeout: 5s
        retries: 5
    # Для сценария 1 (приложение на хосте) – порт открыт, приложение подключается по localhost.
    # Для сценария 2 (всё в Docker) – приложение в контейнере будет использовать имя "db".


    # ==========================================================================
    # Redis Cache Service
    # ==========================================================================
    # Только кэш и rate limiter. Всё, что здесь лежит, имеет TTL и переживать
    # вытеснение не обязано, поэтому allkeys-lru здесь уместен.
    redis:
      image: redis:7-alpine
      container_name: link_shortener_redis
      command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
      restart: unless-stopped
      ports:
        # Слушаем только на петле. Публикация на 0.0.0.0 выставляла Redis в
        # локальную сеть, а записи кэша ничем не подписаны: тот, кто может в
        # него писать, получает открытый редирект на произвольный адрес.
        # Хостовый порт отделён от внутрисетевого: внутри Redis всегда 6379.
        - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
      volumes:
        - redis_data:/data
      healthcheck:
        test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5
    # Аналогично: порт открыт для хоста, внутри сети доступен по имени "redis".


    # ==========================================================================
    # Redis Message Broker (Celery)
    # ==========================================================================
    # Отдельный инстанс, и это не избыточность. Пока брокер жил в одной базе с
    # кэшем, очередь вытеснялась наравне с ним: заполнение памяти давало
    # `llen celery: 0` — поставленные задачи исчезали без следа и без сигнала
    # в /health. Отдельная база не помогла бы, maxmemory-policy действует на
    # сервер целиком, а не на базу (проверено). Здесь noeviction: очередь либо
    # принимается, либо отказывает явно, но не теряется молча.
    redis_broker:
      image: redis:7-alpine
      container_name: link_shortener_redis_broker
      command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy noeviction
      restart: unless-stopped
      ports:
        # Разные переменные для хоста и для сети — в отличие от сервисов выше,
        # где одна переменная означает и то и другое (открытый пункт блока 1).
        # Внутри сети порт фиксирован, менять его незачем.
        - "127.0.0.1:${REDIS_BROKER_HOST_PORT:-6381}:6379"
        # Этот сервис был образцом: остальные приведены к тому же виду.
      volumes:
        - redis_broker_data:/data
      healthcheck:
        test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5


    # ==========================================================================
    # Application Service (Flask)
    # ==========================================================================
    app:
      build: .
      container_name: link_shortener_app
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
        redis_broker:
          condition: service_healthy
        migrations:
          condition: service_completed_successfully
      restart: unless-stopped
      ports:
        # Слева — хостовый порт, справа — тот, который слушает контейнер.
        # Раньше здесь стояло "${PORT}:5000", и PORT означал сразу оба: при
        # PORT=8080 gunicorn слушал 8080 (см. CMD образа), а публикация вела
        # на 5000, где никого не было. Теперь правая сторона следует за самим
        # приложением, а левая двигается независимо.
        - "${APP_HOST_PORT:-5000}:${PORT:-5000}"
      environment:
        # Все переменные переопределены для работы внутри сети

        # ----- Flask / Application settings -----
        PYTHONPATH: /app/src
        FLASK_APP: link_shortener.web.app_factory:create_app
        FLASK_ENV: ${FLASK_ENV}
        FLASK_DEBUG: ${FLASK_DEBUG}
        
        SECRET_KEY: ${SECRET_KEY}
        SHORT_CODE_PEPPER: ${SHORT_CODE_PEPPER}

        # ----- Database settings -----
        DATABASE_TYPE: ${DATABASE_TYPE}
        DATABASE_HOST: db
        # Внутри сети — порт образа, а не настройка хоста.
        DATABASE_PORT: 5432
        DATABASE_NAME: ${DATABASE_NAME}
        DATABASE_USER: ${DATABASE_USER}
        DATABASE_PASSWORD: ${DATABASE_PASSWORD}
        # Connection pool settings (for PostgreSQL)
        DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE}
        DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW}
        DATABASE_POOL_RECYCLE: ${DATABASE_POOL_RECYCLE}
        DATABASE_POOL_PRE_PING: ${DATABASE_POOL_PRE_PING}
        DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT}
        DATABASE_STATEMENT_TIMEOUT: ${DATABASE_STATEMENT_TIMEOUT}

        # ----- Redis / Cache settings -----
        CACHE_ENABLED: ${CACHE_ENABLED}

        REDIS_ENABLED: ${REDIS_ENABLED}
        REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
        REDIS_PORT: 6379
        REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT}
        REDIS_SOCKET_TIMEOUT: ${REDIS_SOCKET_TIMEOUT}
        REDIS_RETRY_INTERVAL: ${REDIS_RETRY_INTERVAL}

        # ----- Logging & Audit settings -----
        LOGGING_ENABLED: ${LOGGING_ENABLED}
        AUDIT_ENABLED: ${AUDIT_ENABLED}
        LOG_LEVEL: ${LOG_LEVEL}
        LOG_TO_CONSOLE: ${LOG_TO_CONSOLE}
        LOG_TO_FILE: ${LOG_TO_FILE}
        LOG_DIR: ${LOG_DIR}
        LOG_FILENAME: ${LOG_FILENAME}
        
        # ----- Celery settings -----
        CELERY_ENABLED: ${CELERY_ENABLED}
        # Брокер живёт в собственном инстансе с noeviction: в одной базе с
        # кэшем очередь вытеснялась вместе с ним.
        CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis_broker:6379/0
        CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis_broker:6379/0
        CELERY_BROKER_TIMEOUT: ${CELERY_BROKER_TIMEOUT}
        HEALTH_CHECK_TIMEOUT: ${HEALTH_CHECK_TIMEOUT}

        # ----- Performance / Workers -----
        # Потолок на запрос — единственное, что прерывает обращение к
        # зависшей (а не упавшей) БД: замороженный сервер не выполняет свой
        # statement_timeout, а его ядро подтверждает TCP-keepalive.
        # GUNICORN_WORKER_CLASS обязан остаться sync: у gthread --timeout
        # запрос не прерывает.
        GUNICORN_WORKERS: ${GUNICORN_WORKERS}
        GUNICORN_WORKER_CLASS: ${GUNICORN_WORKER_CLASS:-sync}
        GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
        GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-20}
      
      env_file:
        # Загружает все переменные, но environment имеет приоритет.
        # ENV_FILE позволяет держать отдельные наборы: .env — локальный запуск
        # без Docker, .env.docker — этот стек. Значение задаётся внутри самого
        # файла окружения, поэтому достаточно одного флага:
        #   docker compose --env-file .env.docker up -d
        - ${ENV_FILE:-.env}
      volumes:
        # Mount logs directory to persist logs on host
        - ${LOG_HOST_PATH}:/app/${LOG_DIR}
      # Команда не задана намеренно: работает CMD образа — gunicorn с
      # потолком на запрос. Разработческий вариант (`flask run --debug`,
      # смонтированные исходники) лежит в docker-compose.override.yml,
      # который compose подхватывает сам.
      healthcheck:
        # timeout= is not optional: without it urlopen has no deadline of its
        # own, so the probe could outlast the timeout below and be killed
        # rather than answer.
        # Порт берётся из PORT, а не прибит к 5000: иначе смена порта
        # приложения превращала healthcheck в вечный отказ, а сервис — в
        # бесконечно перезапускаемый.
        test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:%s/health' % os.environ.get('PORT', '5000'), timeout=8)\""]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 15s


    # ==========================================================================
    # Celery
    # ==========================================================================
    celery_worker:
      build: .
      container_name: link_shortener_celery
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
        redis_broker:
          condition: service_healthy
      restart: unless-stopped
      environment:
        # Общие настройки
        PYTHONPATH: /app/src
        FLASK_ENV: ${FLASK_ENV}
        FLASK_DEBUG: ${FLASK_DEBUG}
        SECRET_KEY: ${SECRET_KEY}
        SHORT_CODE_PEPPER: ${SHORT_CODE_PEPPER}
        
        # База данных – внутри сети используем имя сервиса db
        DATABASE_TYPE: ${DATABASE_TYPE}
        DATABASE_HOST: db
        # Внутри сети — порт образа, а не настройка хоста.
        DATABASE_PORT: 5432
        DATABASE_NAME: ${DATABASE_NAME}
        DATABASE_USER: ${DATABASE_USER}
        DATABASE_PASSWORD: ${DATABASE_PASSWORD}
        DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE}
        DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW}
        DATABASE_POOL_RECYCLE: ${DATABASE_POOL_RECYCLE}
        DATABASE_POOL_PRE_PING: ${DATABASE_POOL_PRE_PING}
        DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT}
        DATABASE_STATEMENT_TIMEOUT: ${DATABASE_STATEMENT_TIMEOUT}
        
        # Redis – внутри сети
        CACHE_ENABLED: ${CACHE_ENABLED}

        REDIS_ENABLED: ${REDIS_ENABLED}
        REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
        REDIS_PORT: 6379
        REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT}
        REDIS_SOCKET_TIMEOUT: ${REDIS_SOCKET_TIMEOUT}
        REDIS_RETRY_INTERVAL: ${REDIS_RETRY_INTERVAL}
        
        # Логирование
        LOGGING_ENABLED: ${LOGGING_ENABLED}
        AUDIT_ENABLED: ${AUDIT_ENABLED}
        LOG_LEVEL: ${LOG_LEVEL}
        LOG_TO_CONSOLE: ${LOG_TO_CONSOLE}
        LOG_TO_FILE: ${LOG_TO_FILE}
        LOG_DIR: ${LOG_DIR}
        LOG_FILENAME: ${LOG_FILENAME}
        
        # Celery
        CELERY_ENABLED: ${CELERY_ENABLED}
        # Брокер живёт в собственном инстансе с noeviction: в одной базе с
        # кэшем очередь вытеснялась вместе с ним.
        CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis_broker:6379/0
        CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis_broker:6379/0
        CELERY_BROKER_TIMEOUT: ${CELERY_BROKER_TIMEOUT}
        HEALTH_CHECK_TIMEOUT: ${HEALTH_CHECK_TIMEOUT}
      
      env_file:
        # Тот же файл, что у app. Без него воркер получал только переменные,
        # перечисленные выше, а на всё остальное брал умолчания из кода —
        # при том, что пишет он в тот же кэш и ту же базу. Замерено на живом
        # стеке: CACHE_LINK_TTL=20 у воркера против 3600 у приложения, то
        # есть записи одного истекали в 180 раз быстрее записей другого.
        # environment выше по-прежнему главнее и удерживает адреса внутри
        # сети (DATABASE_HOST=db и порты образов).
        - ${ENV_FILE:-.env}
      command: celery -A link_shortener.infrastructure.task_queue.celery_app worker --loglevel=info
      volumes:
        - ${LOG_HOST_PATH}:/app/${LOG_DIR}
    # Для сценария 1 (приложение на хосте) – воркер всё равно запускается в контейнере.
    # Для сценария 2 (всё в Docker) – воркер работает в контейнере.
    # Для сценария 3 (приложение в контейнере, остальное на хосте) – если не нужен, можно не запускать.


volumes:
  postgres_data:
  redis_data:
  redis_broker_data:
