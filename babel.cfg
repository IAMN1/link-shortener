# Where `pybabel extract` looks for translatable text.
#
# Regenerating the template and merging it into the catalogues:
#
#   D=src/link_shortener/web/translations
#   V=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
#   uv run pybabel extract -F babel.cfg -o $D/messages.pot --project=link-shortener --version="$V" .
#   uv run pybabel update  -i $D/messages.pot -d $D
#   uv run pybabel compile -d $D
#
# The version is read out of `pyproject.toml` rather than written here: CI
# regenerates the template the same way and diffs it against the one in the
# tree, so a spelled-out version fails that check on the first release after
# it goes stale. `CONTRIBUTING.md` carries the same three commands, with the
# `sed` that drags the two `.po` headers along -- `update` rewrites entries
# and leaves a catalogue's own header alone.
#
# `update` rather than `init`, except for a language that has no catalogue
# yet: `init` starts an empty one and would throw away every translation
# already made.

# Pages. The mail templates are plain text and are listed separately below
# because the extension does not match them.
[jinja2: src/link_shortener/web/templates/**.html]
encoding = utf-8

[jinja2: src/link_shortener/web/templates/**.txt]
encoding = utf-8

# Sentences the service itself produces -- the ones an error handler puts in
# `message`. Listed even where none are marked yet, so adding the first one
# needs no edit here.
[python: src/link_shortener/**.py]
encoding = utf-8
