# Where `pybabel extract` looks for translatable text.
#
# Regenerating the template and merging it into the catalogues:
#
#   uv run pybabel extract -F babel.cfg -o src/link_shortener/web/translations/messages.pot .
#   uv run pybabel update  -i src/link_shortener/web/translations/messages.pot -d src/link_shortener/web/translations
#   uv run pybabel compile -d src/link_shortener/web/translations
#
# `update` rather than `init`, except for a language that has no catalogue
# yet: `init` starts an empty one and would throw away every translation
# already made.

# Pages. The mail templates are plain text and are listed separately below
# because the extension does not match them.
[jinja2: src/link_shortener/web/templates/**.html]
encoding = utf-8

[jinja2: src/link_shortener/web/templates/**.txt]
encoding = utf-8

# Sentences the service itself produces -- the ones an error handler puts in
# `message`. Listed even where none are marked yet, so adding the first one
# needs no edit here.
[python: src/link_shortener/**.py]
encoding = utf-8
